<script>
/* =========================================================================
   MEDIA BASICS — END TERM PREP

   TWO MODES, toggled from the header.

   ✍ EXAM PAPER — built to match the previous year's End Term Assessment:
     eleven caselets, each with a brief and one or more DATA TABLES, then
     questions that make you read the table, compute from it, or criticise
     a statement someone has made about it. Includes the paper's own
     archetypes — "is this always true?", "why is X not equal to Y?",
     "what is NOT right with this statement?", genuine "all of the above"
     trade-offs — and three open-ended written questions with model
     answers and marking schemes.

     Caselets 1, 2, 4, 5, 6, 7 and 8 rebuild the structures of the real
     paper (TV plan across metros, market share table, media consumption
     with duplication, CPRP from TVR and rate, four scheduling patterns
     with a frequency distribution, claimed vs total vs AIR, the premium
     EV launch across IRS / RAM / BARC). Caselets 3, 9, 10 and 11 extend
     the same format to CDI/BDI, digital performance metrics, SOV/ESOV and
     the three budgeting methods.

   ◈ CONCEPT DRILL — the underlying 78-question bank across all nineteen
     session decks, for when you want coverage rather than exam simulation.
     Default scope is a 60-question core paper.

   📋 THE MAP — every formula, benchmark and framework on one page.

   HOUSE RULES on every MCQ: options carry no bold or italic formatting,
   the correct option is never the longest one on screen, and the correct
   option is always authored FIRST and reshuffled on render.
   ========================================================================= */

/* =========================================================================
   EXAM-PATTERN PAPER — caselets, exactly the shape of the End Term paper.
   Each caselet carries a brief and one or more DATA TABLES; the questions
   then ask you to read the table, compute from it, or criticise a statement
   someone has made about it.

   Question archetypes lifted from the real paper:
     · definition applied to the data ("in media terms, Reach refers to…")
     · "what would you optimise first?"
     · "is this always true?" — the nuance trap
     · "why is X not equal to Y?"
     · compute a share / CPRP / CPT / effective reach from the table
     · "what is NOT right with this statement?" — the critique question
     · trade-off questions where ALL OF THE ABOVE is genuinely correct
     · open-ended: risks, arguments, recommendations

   q  = MCQ, correct option authored FIRST, positions reshuffle
   open = written question with a model answer and a marking scheme
   ========================================================================= */
const CASES=[

{id:'k1', cl:'Caselet 1', title:'Energy drink — TV plan across four metros',
 brief:'<p><b>Campaign objective:</b> build awareness for an energy drink. <b>KPI:</b> maximise reach at 80%. <b>Target audience:</b> 20–35 years, NCCS AB, urban metros.</p><p>Below is the TV plan recommended by the media planner. Total GRPs across the four markets = <b>950</b>, and the modelled <b>All-Metro reach is 85%</b>.</p>',
 facts:['TG 20–35 · NCCS AB','KPI: Reach 80%','Total 950 GRPs','All-Metro reach 85%'],
 tables:[{cap:'Recommended TV plan',head:['Market','GRPs','Reach % (1+)','Avg frequency'],
   rows:[['Delhi','250','65%','3.8'],['Mumbai','300','70%','4.3'],['Bangalore','180','55%','3.3'],['Chennai','220','60%','3.7']]}],
 qs:[
 {tag:'concept',diff:'easy',
  q:'In media terms, <b>“Reach”</b> refers to:',
  opts:['% of TG exposed to the campaign at least once',
        '% of TG exposed to the campaign three or more times',
        '% of TG exposed to the campaign on average twice or more',
        'Total ad exposures divided by the population'],
  why:'<b>Reach 1+</b> is the proportion of the target audience exposed to the campaign <b>at least once</b>. Multiple exposures are the business of <b>frequency</b>, and exposures divided by population is closer to <b>GRPs</b>.<div class="work">Reach 1+   unique people, at least once\nFrequency  average exposures per person\n           reached = GRPs ÷ Reach\nGRP        Reach × Frequency — total weight,\n           duplication included</div>Check it against the table: Delhi 250 GRPs ÷ 65 reach = <b>3.8 frequency</b>, exactly as printed. Every row is internally consistent, which is your first sanity check on any plan table you are handed.'},

 {tag:'apply',diff:'easy',
  q:'The brand wants to build <b>awareness</b>. What do you optimise first?',
  opts:['Reach at 1+',
        'Effective reach and frequency',
        'CPRP',
        'CPT'],
  why:'<b>Awareness campaigns prioritise maximising Reach 1+</b> — get the largest number of unique people exposed at least once. <b>Frequency optimisation follows at a later stage</b>, once the reach base exists.<br><br>CPRP and CPT are <b>efficiency</b> metrics, not objectives. They tell you what the reach cost, not whether you built enough of it. A plan can have an excellent CPRP and still fail an awareness brief.<br><br>Read the KPI line in the brief before anything else: <b>“maximise reach at 80%”</b>. That single line rules out three of these four answers.'},

 {tag:'apply',diff:'medium',trap:true,
  q:'Mumbai has higher reach than Bangalore because its GRPs are higher (300 vs 180). This statement is:',
  opts:['Not always true — reach depends on duplication and reach curves',
        'Always true, since reach and GRPs move together',
        'Incorrect, because Bangalore’s frequency could be higher',
        'Only valid if the average OTS is identical across both of these markets'],
  why:'<b>Higher GRPs often correlate with higher reach — but not always.</b> The shape of the <b>reach curve</b>, the level of <b>duplication</b> between channels and dayparts, and <b>saturation</b> all affect how much reach a given weight buys.<div class="work">Reach per GRP in this plan:\n  Delhi      65 ÷ 250 = 0.26\n  Mumbai     70 ÷ 300 = 0.23\n  Bangalore  55 ÷ 180 = 0.31 ← most efficient\n  Chennai    60 ÷ 220 = 0.27</div>Bangalore converts GRPs into reach <b>more efficiently than Mumbai</b> — it simply bought less weight. A market with a fragmented channel landscape or a narrower anchor channel will climb its curve differently.<br><br>Option C is the near-miss: Bangalore’s frequency is in fact <i>lower</i> (3.3 vs 4.3), and in any case frequency does not explain why reach and GRPs need not move together.'},

 {tag:'apply',diff:'medium',
  q:'Total GRPs across the four markets is 950, but All-Metro reach is only 85%. Why is that not the sum of the individual market reaches?',
  opts:['Reach is not additive across markets because audiences overlap',
        'Because reach is mathematically capped at 100%',
        'Because GRPs cannot be divided by reach',
        'Because TVR is always calculated as total impressions divided by 1,000'],
  why:'<b>Reach is not additive.</b> Many urban consumers watch <b>national channels</b>, so the same individual can be counted inside more than one market’s reach figure. At an All-Metro level those duplicates collapse into one person, and the combined reach lands <b>below the sum of the parts</b>.<br><br>This is the same net-versus-gross logic as within a single market:<div class="work">Gross = simple sum, duplication included\nNet   = unique people, counted once\nThe gap between them IS the duplication</div>Option B is the trap that sounds sensible. The cap at 100% is real but it is not the <i>reason</i> — even well below 100%, reaches still would not add up, because the problem is overlap rather than arithmetic ceiling.'},

 {tag:'apply',diff:'hard',trap:true,
  q:'To lift Delhi from 65% to the 80% KPI, the planner budgets proportionally more GRPs. Why is that the right instinct?',
  opts:['Reach curves flatten, so each extra reach point costs progressively more weight',
        'Because CPRP rises automatically once reach crosses 70%',
        'Because the average frequency must be held constant at 3.8 throughout the entire flight',
        'Because BARC caps the reach any single market can report'],
  why:'A <b>reach curve climbs fast and then flattens</b> — early GRPs land on new people, later GRPs increasingly land on people already reached. So the GRPs needed per additional reach point <b>rise as you approach the ceiling</b>.<div class="work">Early GRPs  → mostly NEW people → reach ↑ fast\nLater GRPs  → mostly REPEAT exposure\n            → reach ↑ slowly, FREQUENCY ↑</div>The practical consequence, and a favourite exam point: going from 65% to 80% is <b>not</b> 1.23× the weight. It can easily be double, and the extra weight arrives as frequency whether you wanted it or not.<br><br>If the curve makes 80% unaffordable in Delhi, the honest planner’s options are to <b>add channels or dayparts to shift the curve upward</b>, extend the flight, or renegotiate the KPI — not to keep buying the same schedule harder.'},
]},

{id:'k2', cl:'Caselet 2', title:'Four markets — size, share and growth',
 brief:'<p>A brand is deciding where to concentrate next year’s media investment. Total brand sales across these four markets = <b>₹140 Cr</b>; total category sales = <b>₹1,180 Cr</b>.</p>',
 facts:['Brand total ₹140 Cr','Category total ₹1,180 Cr','Overall brand share 11.9%'],
 tables:[{cap:'Market data',head:['Market','Category sales (₹ Cr)','Brand sales (₹ Cr)','Category growth'],
   rows:[['Delhi','400','60','12%'],['Mumbai','500','40','10%'],['Chennai','200','25','18%'],['Coimbatore','80','15','20%']]}],
 qs:[
 {tag:'calc',diff:'medium',
  q:'In which market does the brand hold the <b>highest share</b>?',
  opts:['Coimbatore',
        'Delhi, on ₹400 Cr of category sales',
        'Mumbai',
        'Chennai'],
  why:'Brand share within a market = <b>brand sales ÷ category sales</b> in that market.<div class="work">Delhi       60 ÷ 400 = 15.0%\nMumbai      40 ÷ 500 =  8.0%\nChennai     25 ÷ 200 = 12.5%\nCoimbatore  15 ÷  80 = 18.75% ← highest</div>Note how the ranking <b>inverts absolute size</b>: Mumbai is the biggest category (₹500 Cr) and the weakest share; Coimbatore is the smallest category and the strongest share.<br><br>Overall the brand holds 140 ÷ 1,180 = <b>11.9%</b>, so Delhi, Chennai and Coimbatore all sit <i>above</i> the brand’s own average and Mumbai sits below it. That single comparison is often enough to start a prioritisation argument.'},

 {tag:'apply',diff:'medium',
  q:'Why is Mumbai tricky to prioritise despite being the largest market at ₹500 Cr?',
  opts:['Growth is only 10% and brand share is weak at 8%',
        'Because CPRP is higher in Mumbai than in the other three markets',
        'Because BDI and CDI are not defined for markets of that size',
        'Because large metros always require disproportionately heavy media weight'],
  why:'<b>Size is attractive, but low share and moderate growth make it less attractive than smaller, higher-growth, higher-share markets.</b> Mumbai is the biggest prize and also the hardest to move — the brand has spent years reaching only 8% of it.<br><br>That does not automatically mean “skip Mumbai”. It means the decision needs a reason: is the weak share a <b>demand</b> problem, a <b>distribution</b> problem, or a <b>share-of-voice</b> problem? The answer changes whether media is even the right lever.<br><br>Option B is the classic distractor — CPRP may well be higher in Mumbai, but nothing in the table says so, and <b>an answer that needs data you were not given is the wrong answer</b>.'},

 {tag:'apply',diff:'medium',trap:true,
  q:'A brand manager says: “We should invest equally across all four markets, because together they make up our ₹140 Cr of sales.” What is <b>not right</b> with this approach?',
  opts:['It ignores category size, growth potential and competitive intensity',
        'GRPs cannot be split equally across markets in a TV plan',
        'It violates the A2S budgeting method',
        'Equal investment only ever works in fast-moving consumer goods categories'],
  why:'<b>Equal allocation is simplistic.</b> Real prioritisation weighs <b>market size, category growth and the brand’s relative strength</b> — plus competitive intensity and whether the business can service the demand it creates.<div class="work">Delhi       big, healthy share, solid growth\nMumbai      biggest, weakest share, slowest growth\nChennai     mid-size, decent share, 18% growth\nCoimbatore  small, best share, fastest growth</div>Four genuinely different jobs: defend Delhi, diagnose Mumbai, grow Chennai, harvest Coimbatore. One budget split cannot do four jobs.<br><br>The <b>A2S (advertising-to-sales) method</b> in option C is a way of setting the <i>total</i> budget as a percentage of sales — it has nothing to say about splitting that total across markets.'},

 {tag:'apply',diff:'hard',
  q:'Coimbatore has the best share and the fastest growth. What is the caution before pouring budget into it?',
  opts:['Its absolute category size is only ₹80 Cr, so the upside is capped',
        'High growth markets always revert to the national average within a year',
        'Brand share above 15% cannot be increased any further',
        'Media inventory in smaller markets is priced at metro rates'],
  why:'<b>Always read the index or the percentage alongside the absolute number.</b> Coimbatore’s 18.75% share and 20% growth are genuinely the best in the table — on a base of <b>₹80 Cr</b>, the smallest of the four.<div class="work">Closing Mumbai’s share gap from 8% to 12%\n  = 4% × ₹500 Cr = ₹20 Cr of brand sales\nDoubling Coimbatore’s share to 37%\n  = 18% × ₹80 Cr ≈ ₹15 Cr — and far harder</div>This is the same pitfall the CDI/BDI framework warns about: <b>a spectacular index in a tiny market may still generate very little revenue.</b><br><br>The balanced read: Coimbatore is a <b>defend-and-harvest</b> market where distribution and pack economics matter more than media weight, while the incremental media rupee probably works hardest in a large market where the brand under-performs.'},
]},

{id:'k3', cl:'Caselet 3', title:'Five states — where should the weight go?',
 brief:'<p>The same brand now looks at the national picture. Each column is that market’s <b>share of the national total</b>, so each column sums to 100% across all markets in the country.</p>',
 facts:['CDI = %category ÷ %population × 100','BDI = %brand ÷ %population × 100','100 = the national norm'],
 tables:[{cap:'Share of national totals',head:['Market','% TG population','% category sales','% brand sales'],
   rows:[['Maharashtra','9%','12%','8%'],['Kerala','3%','4%','7%'],['Tamil Nadu','6%','7%','12%'],['West Bengal','8%','9%','9%'],['Uttar Pradesh','17%','13%','7%']]}],
 qs:[
 {tag:'calc',diff:'medium',
  q:'What are <b>CDI</b> and <b>BDI</b> for Maharashtra?',
  opts:['CDI 133 and BDI 89',
        'CDI 89 and BDI 133',
        'CDI 75 and BDI 112',
        'CDI 133 and BDI 150'],
  why:'<div class="work">CDI = % category sales ÷ % population × 100\n    = 12 ÷ 9 × 100 = 133\nBDI = % brand sales ÷ % population × 100\n    =  8 ÷ 9 × 100 =  89</div>Read them as a pair. <b>CDI 133</b> says the <i>category</i> is 33% over-developed here — people in Maharashtra buy more of this category than their population share would suggest. <b>BDI 89</b> says <i>our brand</i> still lags its own population share.<br><br>That gap is the opportunity: <b>demand exists and we are not capturing it.</b><div class="work">Kerala      CDI 133  BDI 233\nTamil Nadu  CDI 117  BDI 200\nWest Bengal CDI 113  BDI 113\nUttar Pradesh CDI 76 BDI  41</div>'},

 {tag:'apply',diff:'medium',
  q:'Which market is the clearest case for <b>attacking with extra media weight</b>?',
  opts:['Maharashtra — high category demand, brand under-developed',
        'Kerala — the brand already over-indexes heavily there',
        'Uttar Pradesh — it holds the largest share of population',
        'West Bengal — both indices sit close to the national norm'],
  why:'<b>High CDI with low BDI is the growth quadrant.</b> Maharashtra has 12% of category sales and only 8% of brand sales — closing that gap is worth more absolute volume than anything available in the smaller strongholds.<div class="work">High CDI · High BDI  DEFEND leadership\nHigh CDI · Low BDI   ATTACK — the growth market\n  drive ESOV, focus on reach, localise creative\nLow CDI · High BDI   HARVEST the niche\n  do not overspend on media\nLow CDI · Low BDI    SKIP / test and learn</div>Kerala is the opposite case: <b>BDI ÷ CDI = 233 ÷ 133 = 1.75</b>, so the brand is outperforming category demand by 75%. That is a market to <b>defend at efficient weight</b>, where incremental media hits diminishing returns fast.<br><br>West Bengal sits at the norm on both axes — <b>it is a decision, not a datapoint</b>: it goes wherever the business objective sends it.'},

 {tag:'apply',diff:'hard',trap:true,
  q:'Uttar Pradesh holds 17% of the national population — the largest of any market here. Why should it not lead the plan?',
  opts:['CDI is 76, so category demand has to be built before brand share can be',
        'Because BDI of 41 means distribution there is already saturated',
        'Because population share is irrelevant once CDI has been calculated',
        'Because Hindi-speaking markets are always planned separately from the national plan'],
  why:'<b>Size is not demand.</b> UP holds 17% of the population and only 13% of category sales — the <b>category itself is under-developed</b> there (CDI 76), before you even get to the brand’s weak 41.<br><br>A national plan weighted by population <b>over-invests in UP every single year</b>. It is a long game judged on <b>category penetration movement</b> rather than brand share, and <b>media alone will not build the category</b>.<br><br>Option B inverts the logic: a low BDI often signals the <i>opposite</i> of saturation — it may simply mean poor availability. Which is the pitfall worth memorising: <b>do not confuse distribution with demand. Increasing media will not solve a distribution problem.</b>'},

 {tag:'concept',diff:'medium',
  q:'Before calculating either index, which rule matters most?',
  opts:['Use the identical population base for both CDI and BDI',
        'Re-centre both indices on the average of the markets in your sample',
        'Calculate CDI on population and BDI on category sales',
        'Restrict the calculation to markets contributing over 10% of sales'],
  why:'Three rules before you calculate anything:<div class="work">1 SAME BASE for both indices — and use the\n  TARGET AUDIENCE population wherever\n  possible, not the total population\n2 100 IS THE NORM by construction — never\n  re-centre the axes on your own sample’s\n  average, or the index stops meaning\n  “versus the national norm”\n3 SHARES, NOT ABSOLUTES — every input is a\n  percentage of the national total, and each\n  column should sum to 100%</div>Option C describes a genuine and common error: BDI’s denominator is <b>population</b>, not category sales. Divide brand share by category share and you get something else entirely — that ratio is <b>BDI ÷ CDI</b>, which is useful, but it is not BDI.'},
]},

{id:'k4', cl:'Caselet 4', title:'Media consumption for Brand X’s target audience',
 brief:'<p>Below is the media consumption profile for Brand X’s TG. <b>Duplication with TV</b> is the share of that medium’s audience already reached by the TV plan.</p>',
 facts:['TV is the anchor medium','CPT = cost per thousand','Duplication = overlap with TV'],
 tables:[{cap:'Media profile · Brand X TG',head:['Medium','Reach %','Affinity %','Time spent (mins/wk)','CPT (₹)','Duplication with TV'],
   rows:[['TV','85%','70%','420','200','—'],['Print','40%','75%','55','250','55%'],['Radio','35%','55%','120','150','30%'],['OOH','25%','60%','—','300','20%'],['Digital Video','75%','90%','180','120','65%'],['Social Media','80%','95%','300','100','70%']]}],
 qs:[
 {tag:'apply',diff:'easy',
  q:'Which medium delivers the strongest balance of <b>affinity and time spent</b> for this TG?',
  opts:['Social Media — highest affinity and high time spent',
        'TV — the highest reach of any medium in the table',
        'Print — very high affinity, though time spent is low',
        'Digital Video — high affinity with a comparatively low CPT'],
  why:'Read only the two columns the question names.<div class="work">            Affinity   Time spent\nSocial Media   95%        300 mins ← best on both\nDigital Video  90%        180 mins\nPrint          75%         55 mins\nTV             70%        420 mins\nOOH            60%          —\nRadio          55%        120 mins</div><b>Social Media shows the highest affinity (95%) and the second-longest time spent (300 mins)</b>, and it is also the cheapest on CPT at ₹100.<br><br>TV wins on <b>reach</b> and on raw minutes, but its affinity of 70% is the weakest of the big three — it reaches this TG as part of reaching everybody. Print is the mirror image: good fit, almost no time.<br><br>The discipline the question is testing: <b>answer on the criteria stated, not on the column you find most interesting.</b>'},

 {tag:'apply',diff:'hard',trap:true,
  q:'If the KPI is <b>awareness (reach 1+)</b>, which medium gives the most efficient <b>incremental</b> reach beyond TV?',
  opts:['Radio — 35% reach with only 30% overlap, at a CPT of ₹150',
        'Print — 40% reach, but 55% of it already overlaps with TV',
        'Digital Video — 75% reach with 65% duplication against TV',
        'Social Media — 80% reach, though 70% duplicates the TV audience'],
  why:'The model answer is <b>Radio</b>: <b>lower duplication with TV, at a low CPT, makes it the efficient incremental buy.</b> Only 30% of its audience is already in the TV plan, so most of what you buy is genuinely new.<br><br><b>Do the arithmetic as well, because the two readings differ.</b> Unique increment ≈ reach × (1 − duplication):<div class="work">Print          40 × 0.45 = 18.0 pts\nRadio          35 × 0.70 = 24.5 pts\nDigital Video  75 × 0.35 = 26.3 pts ← largest\nSocial Media   80 × 0.30 = 24.0 pts\nOOH            25 × 0.80 = 20.0 pts</div>On <b>absolute</b> incremental reach Digital Video adds the most; on <b>efficiency</b> — increment per rupee, given Radio’s ₹150 CPT and its far lower overlap — Radio is the answer the paper wants, and the word in the question is <b>“efficient”</b>.<br><br>Worth carrying both into the exam: name Radio, then show the multiplication. A planner who can say “Radio is the efficient increment, Digital Video is the larger one” has answered better than the option list allows.'},

 {tag:'calc',diff:'medium',
  q:'Which medium is <b>cheapest per thousand</b>, and what does that alone not tell you?',
  opts:['Social Media at ₹100 — cheap contact, but it says nothing about incremental reach',
        'Digital Video at ₹120 — comfortably the lowest CPT of any medium listed in the table',
        'Radio at ₹150 — cheap because its audience is small',
        'TV at ₹200 — expensive per contact but unmatched on total reach'],
  why:'<b>Social Media at ₹100 CPT is the cheapest contact in the table</b> — and it duplicates <b>70%</b> of the TV audience. You would be buying a great price on people you have already reached.<div class="work">Social Media  ₹100   duplication 70%\nDigital Video ₹120   duplication 65%\nRadio         ₹150   duplication 30%\nTV            ₹200   the anchor\nPrint         ₹250   duplication 55%\nOOH           ₹300   duplication 20%</div>Which is the whole point of the duplication column: <b>CPT prices a contact, not an incremental contact.</b> On an awareness brief, the right comparison is cost per <i>new</i> person reached, and that reshuffles this ranking completely.<br><br>Same caution in the other direction for OOH: the most expensive CPT in the table, and the least duplicated audience.'},

 {tag:'apply',diff:'medium',
  q:'The planner argues for Print because its affinity (75%) beats TV’s (70%). What is the flaw?',
  opts:['Affinity describes fit, not scale — Print reaches less than half of TV’s audience',
        'Affinity below 100 always means the medium under-indexes on the TG',
        'Print cannot be compared with TV at all, because its CPT is quoted on a different basis',
        'Affinity is only a valid comparison between two digital media channels'],
  why:'<b>Affinity tells you how well a medium fits the TG; reach tells you how much of the TG it can deliver.</b> Print’s 75% affinity against 40% reach is a good fit with limited scale — perfectly sensible as a <i>support</i> medium, and a poor argument for leading an awareness plan.<br><br>The three lenses are used together for exactly this reason:<div class="work">REACH      how many? → potential SCALE\nAFFINITY   how well does it fit? → audience FIT\nTIME SPENT how much opportunity? → DEPTH</div>Option B is a real trap for anyone half-remembering the index. The <b>affinity index</b> is centred on 100, where above 100 means over-indexing. This table reports <b>affinity as a percentage</b>, which is a different scale — 75% here is not “under-indexing”, it is simply the share of that medium’s audience falling in the TG.'},
]},

{id:'k5', cl:'Caselet 5', title:'Detergent brand — channel costs in Maharashtra',
 brief:'<p>TVRs and rates for <b>Women 24–44, NCCS ABC, Maharashtra</b>. The brand is planning a four-week burst and has <b>₹3 Cr</b> of working TV budget.</p>',
 facts:['TG Women 24–44 NCCS ABC','Budget ₹3 Cr','CPRP = Rate ÷ TVR'],
 tables:[{cap:'BARC data and card rates',head:['Channel','Genre','TVR (%)','Rate / 10 sec (₹)'],
   rows:[['Star Plus','GEC','4.0','2,50,000'],['Colors','GEC','3.0','2,00,000'],['Sony','GEC','2.0','1,50,000'],['Star Sports','Sports','2.5','2,80,000']]}],
 qs:[
 {tag:'calc',diff:'medium',
  q:'What is the <b>CPRP for Colors</b>?',
  opts:['₹66,667',
        '₹6,00,000',
        '₹6,667',
        'CPRP cannot be lower than Sony’s, because Sony’s card rate is lower'],
  why:'<b>CPRP = Rate ÷ TVR</b> = 2,00,000 ÷ 3.0 = <b>₹66,667</b> per rating point.<div class="work">Star Plus    2,50,000 ÷ 4.0 = ₹62,500 ← cheapest\nColors       2,00,000 ÷ 3.0 = ₹66,667\nSony         1,50,000 ÷ 2.0 = ₹75,000\nStar Sports  2,80,000 ÷ 2.5 = ₹1,12,000</div>Option D is the reasoning trap, and it is worth pausing on: <b>Sony has the lowest card rate and the worst CPRP in the GEC set.</b> A cheap spot that delivers few rating points is not cheap — you have to buy more of them.<br><br>That is why CPRP, not rate, is the negotiation currency. <b>The cheapest channel on the rate card is rarely the cheapest channel per point of weight.</b>'},

 {tag:'calc',diff:'medium',
  q:'At Star Plus’s CPRP, how many GRPs does the ₹3 Cr budget buy?',
  opts:['480 GRPs',
        '750 GRPs',
        '120 GRPs',
        '1,200 GRPs'],
  why:'<b>GRPs affordable = Budget ÷ CPRP</b><div class="work">Star Plus CPRP = 2,50,000 ÷ 4.0 = ₹62,500\nGRPs = 3,00,00,000 ÷ 62,500 = 480 GRPs\n\nThe same ₹3 Cr elsewhere:\n  Colors      ÷ 66,667   = 450 GRPs\n  Sony        ÷ 75,000   = 400 GRPs\n  Star Sports ÷ 1,12,000 = 268 GRPs</div>This single division is what converts a rupee budget into a media weight target, and <b>that number becomes the ceiling for every step that follows</b> — the weekly allocation, the channel split, and the reach the plan can honestly claim.<br><br>Note the spread: the same money buys <b>480 GRPs on Star Plus or 268 on Star Sports</b>. Whether that is a bad trade depends entirely on what the sports audience is worth to you, which is the next question.'},

 {tag:'apply',diff:'medium',
  q:'The brand chooses Star Sports over the GECs for impact. What trade-off occurs?',
  opts:['All of the above',
        'Higher CPRP, but access to a distinct audience',
        'Lower reach against a narrower, more niche audience',
        'Sponsorship formats can create stronger recall'],
  why:'<b>All three are true at once, which is what makes it a trade-off rather than a mistake.</b><div class="work">Higher CPRP  ₹1,12,000 vs ₹62,500 — nearly 2×\nLower reach  fewer affordable GRPs (268 vs 480)\n             against a narrower audience\nBut          a distinct, less duplicated audience\n             and sponsorship/integration formats\n             that a spot buy cannot deliver</div>The exam paper uses “All of the above” as a genuine answer in exactly this kind of question — when it lists several consequences of one decision, check whether they can all hold simultaneously before hunting for the single best one.<br><br>The judgement to state: for a <b>Women 24–44 detergent TG</b>, a sports property is an expensive way to buy reach, and can still be right if the goal is impact, distinctiveness or an audience the GECs are not delivering.'},

 {tag:'apply',diff:'medium',trap:true,
  q:'The client says: “We bought 300 GRPs, so every person in the TG saw the ad exactly three times.” What is <b>not right</b> with that?',
  opts:['All of the above',
        'GRPs describe an average, not a uniform level of exposure',
        'Some people may see it zero times and others ten or more',
        'The frequency distribution is uneven by nature'],
  why:'<b>All of the above.</b> GRPs represent <b>total weight</b>, and dividing them by reach gives an <b>average</b>. The actual frequency distribution is always skewed — a tail of heavy viewers absorbs far more exposures than the average suggests, while a large group sees the campaign once or not at all.<div class="work">300 GRPs might be:\n  60% reach × 5.0 average frequency\n  or 75% reach × 4.0\n  or 40% reach × 7.5\nand within ANY of those, individuals range\nfrom 0 exposures to 15+</div>This is the same trap as “we reached 60% at an average frequency of 4 — so everyone saw it four times”. The honest answer to that is <b>we cannot tell without the exposure distribution</b>.<br><br>Which is why plans are evaluated on <b>effective reach at 3+</b> rather than on average frequency: it counts the people who actually cleared the threshold.'},
]},

{id:'k6', cl:'Caselet 6', title:'Twelve-week TV campaign — four scheduling patterns',
 brief:'<p>The brand plans a <b>12-week TV campaign in Delhi and Mumbai</b>. Budget = <b>₹6 Cr</b>. TG = Women 18–35, NCCS ABC. All four options deliver the <b>same 600 GRPs</b> — only the pattern changes.</p>',
 facts:['12 weeks · ₹6 Cr','600 GRPs in every plan','Delhi + Mumbai','TG Women 18–35 NCCS ABC'],
 tables:[
  {cap:'The four scheduling options',head:['Plan','GRPs','Strategy','Pattern'],
   rows:[['A','600','Continuous','50 GRPs/week for 12 weeks'],['B','600','Flighting','100 GRPs/week for 6 alternate weeks'],['C','600','Pulsing','40 GRPs/week baseline + 80 in 3 bursts'],['D','600','Roadblock','600 GRPs in Week 1 only']]},
  {cap:'Resultant frequency distribution (% of TG)',head:['Exposures','Plan A','Plan B','Plan C','Plan D'],
   rows:[['0','25','30','28','45'],['1–2','30','10','18','5'],['3–4','25','20','20','10'],['5–6','10','20','15','15'],['7+','10','20','19','25']]}],
 qs:[
 {tag:'apply',diff:'medium',
  q:'If the brand wants <b>sustained awareness</b>, which plan is least suitable despite identical GRPs?',
  opts:['Plan D — Roadblock',
        'Plan A — Continuous',
        'Plan B — Flighting',
        'Plan C — Pulsing'],
  why:'<b>A roadblock gives a sharp burst and then eleven weeks of silence.</b> Sustained awareness needs <b>continuity or pulsing</b> — regular opportunities to be seen as memory decays.<br><br>The forgetting curve is the reason: without reinforcement, newly formed memory <b>declines fastest early</b> and then fades into a slower tail. Eleven dark weeks after Week 1 is the worst possible shape for a brief that says “sustained”.<div class="work">Reach 1+ delivered (100 − the 0-exposure row):\n  Plan A  75%  ← widest\n  Plan B  70%\n  Plan C  72%\n  Plan D  55%  ← narrowest</div>Plan D is worst on both counts: <b>the narrowest reach and the least continuity</b>, from exactly the same 600 GRPs. All the weight piles onto a small group in a single week.'},

 {tag:'apply',diff:'medium',
  q:'If the budget were cut to <b>₹3 Cr</b>, which plan would lose the most efficiency?',
  opts:['Plan B — Flighting',
        'Plan A — Continuous',
        'Plan C — Pulsing',
        'Plan D — Roadblock'],
  why:'<b>Flighting already alternates on and off weeks.</b> Halve the budget and the bursts get shorter or fewer, so the <b>dark periods stretch further</b> — and the pattern’s whole logic was that each burst had to be heavy enough to register before going quiet.<div class="work">Plan A  50 → 25 GRPs/week: thinner, but the\n  brand stays present every week\nPlan B  6 bursts → 3, or 100 → 50 GRPs each:\n  either way the silences grow\nPlan C  baseline survives, bursts shrink —\n  degrades gracefully\nPlan D  already one week; a smaller roadblock\n  is simply a smaller roadblock</div>The transferable point: <b>patterns that depend on concentrated weight are the most fragile to a budget cut</b>, because below a threshold the burst stops doing the job the burst existed to do. Continuous and pulsing both degrade more gently.'},

 {tag:'apply',diff:'easy',
  q:'The brand needs festival spikes <b>and</b> a steady presence. Which pattern fits?',
  opts:['Pulsing',
        'Flighting',
        'Continuous',
        'Roadblock'],
  why:'<b>Pulsing keeps a baseline running all the way through and layers heavier bursts on top when demand or the calendar calls for it</b> — which is precisely “steady presence plus festival spikes”.<div class="work">CONTINUITY steady presence, no peaks.\n  Toothpaste, detergents, telecom, banking\nFLIGHTING  bursts and planned dark periods.\n  Air conditioners, tax platforms, festive gifting\nPULSING    baseline + bursts — the practical\n  compromise. E-commerce, autos, paints,\n  beverages\nROADBLOCK  everything in one window.\n  Launch day, a film release, an event</div>The deck’s own summary: <b>pulsing protects recency with continuous presence while building additional frequency around high-value periods.</b> Its watch-out is cost — it gets expensive if every period is treated as a peak.'},

 {tag:'apply',diff:'medium',
  q:'Which plan carries the highest <b>frequency wastage</b> — too many people at 7+ exposures?',
  opts:['Plan D — 25% of the TG at 7+, while 45% see nothing',
        'Plan B — 20% at 7+, spread over six burst weeks',
        'Plan C — 19% at 7+, around three planned bursts',
        'Plan A — 10% at 7+, the flattest distribution of the four'],
  why:'Read the bottom row of the distribution table and the top row together.<div class="work">           7+ exposures   0 exposures\nPlan A         10%            25%\nPlan B         20%            30%\nPlan C         19%            28%\nPlan D         25%            45%  ← worst on both</div><b>Concentrating 600 GRPs into a single week produces heavy over-exposure</b> on the people who happen to be watching that week, and reaches nobody else at all. A quarter of the TG is hammered 7+ times while nearly half never see the campaign.<br><br>That is the definition of wastage: <b>weight delivered beyond the point where extra exposures change behaviour</b>, funded by weight that never arrived anywhere else. Plan A has the flattest, most useful distribution — 10% at 7+ and the smallest unreached group.'},

 {tag:'calc',diff:'hard',
  q:'Which plan delivers the highest <b>effective reach at 3+</b>?',
  opts:['Plan B at 60%',
        'Plan A at 45%',
        'Plan C at 54%',
        'Plan D at 50%'],
  why:'Effective reach at 3+ sums every band at or above three exposures.<div class="work">Plan A  25 + 10 + 10 = 45%\nPlan B  20 + 20 + 20 = 60%  ← highest\nPlan C  20 + 15 + 19 = 54%\nPlan D  10 + 15 + 25 = 50%</div>Now put it beside the previous answers and the real lesson appears:<div class="work">          Reach 1+   Effective 3+   7+ wastage\nPlan A      75%         45%            10%\nPlan B      70%         60%            20%\nPlan C      72%         54%            19%\nPlan D      55%         50%            25%</div><b>Plan A wins on reach 1+. Plan B wins on effective reach 3+.</b> Same 600 GRPs, opposite strengths — and which is “best” depends entirely on the objective.<br><br>For the awareness brief in this caselet, <b>A</b>. For a complex message needing repetition to register, <b>B</b>. This is why a plan can never be judged before the objective is fixed.'},

 {tag:'concept',diff:'medium',trap:true,
  q:'A planner defends Plan D: “It still delivers 600 GRPs, so the weight is identical.” What is the flaw?',
  opts:['GRPs are weight, not reach — the same weight can be distributed very differently',
        'Roadblocks always cost more per rating point than an equivalent continuous schedule',
        'GRPs cannot be compared across schedules of different lengths',
        'Six hundred GRPs is below the threshold for any awareness campaign'],
  why:'<b>Identical GRPs, four different campaigns.</b> The weight is the same; the <b>distribution</b> of that weight across people and across weeks is not — and the distribution is what determines whether the campaign works.<div class="work">GRP = Reach × Frequency\n600 = 75 × 8.0   (Plan A)\n600 = 55 × 10.9  (Plan D)</div>Same left-hand side, very different right-hand sides. Plan D buys its 600 GRPs almost entirely as <b>frequency on a narrow base</b>.<br><br>This is the scheduling version of the GRP trap that runs through the whole paper: <b>a single summary number that several very different plans can share.</b> The follow-up question is always “distributed how?” — across weeks, and across the frequency bands.'},
]},

{id:'k7', cl:'Caselet 7', title:'Print — readership, rates and what CPT is built on',
 brief:'<p>Three dailies are under consideration. <b>Claimed</b> is self-declared readership, <b>Total</b> is total readership and <b>AIR</b> is Average Issue Readership — the number who read an average issue.</p>',
 facts:['IRS data','Claimed ≠ Total ≠ AIR','CPT = cost per thousand'],
 tables:[{cap:'Publication data',head:['Publication','City','Claimed (000)','Total (000)','AIR (000)','Ad rate (₹/sq cm)','CPT (₹)','Premium position'],
   rows:[['TOI Delhi','Delhi','1,800','1,200','750','2,500','2.1','Front page jacket'],['HT Delhi','Delhi','1,400','900','500','2,000','2.2','Back page'],['The Hindu','Chennai','1,000','600','400','1,500','2.5','Page 3']]}],
 qs:[
 {tag:'apply',diff:'medium',
  q:'A planner uses <b>claimed readership</b> (TOI = 1.8M) to calculate CPT. Why is that incorrect?',
  opts:['All of the above',
        'Claimed readership exaggerates the true audience',
        'It makes the resulting CPT look artificially low',
        'Total or AIR is the more realistic basis for ad delivery'],
  why:'<b>All of the above.</b> Claimed readership is self-declared and inflated; dividing cost by an inflated audience produces a CPT that <b>looks cheaper than the buy really is</b>; and <b>Total or AIR is closer to what an insertion actually delivers</b>.<div class="work">TOI Delhi\n  Claimed 1,800k  ← inflated, flattering\n  Total   1,200k\n  AIR       750k  ← what one insertion reaches\nUsing claimed rather than AIR understates\ncost per thousand by a factor of 2.4×</div><b>AIR — Average Issue Readership — is the number who read an average issue</b>, which is the right denominator when you are buying space in one issue. Total readership counts anyone who read the title in the period, and claimed is a survey artefact.<br><br>The general habit: <b>always ask which audience number a quoted efficiency metric was divided by.</b> The same is true of digital impressions, OOH footfall estimates and competitor spend.'},

 {tag:'calc',diff:'medium',
  q:'On the CPT column as given, which title is the most efficient — and what does that not settle?',
  opts:['TOI at ₹2.1 — but efficiency does not tell you whether the audience is the right one',
        'The Hindu at ₹2.5 — the highest CPT always indicates the strongest possible audience',
        'HT at ₹2.2 — the middle CPT is the safest choice in any print plan',
        'All three are identical once the ad rate is divided by claimed readership'],
  why:'<b>TOI is the most efficient on CPT at ₹2.1</b>, ahead of HT (₹2.2) and The Hindu (₹2.5). It also has the largest AIR at 750k and the highest ad rate — scale is what makes a high rate efficient.<div class="work">CPT     AIR      Rate\nTOI     ₹2.1  750k   ₹2,500/sq cm\nHT      ₹2.2  500k   ₹2,000/sq cm\nHindu   ₹2.5  400k   ₹1,500/sq cm</div>What CPT does not settle: <b>whether those readers are your TG</b>. The Hindu’s Chennai readership may over-index sharply for an English-speaking, upmarket audience, in which case a worse CPT can still be the better buy — exactly the affinity-versus-efficiency tension from the EV caselet.<br><br>Nor does it settle <b>position</b>: a front-page jacket and a Page 3 strip are not the same product, and the premium position column is priced separately from the base rate.'},

 {tag:'concept',diff:'medium',
  q:'Why does TOI command the highest ad rate of the three?',
  opts:['It has the largest readership base and the strongest premium positions',
        'Because its CPT is the lowest of the three publications',
        'Because Delhi editions are regulated at a higher rate band',
        'Because claimed readership is the basis on which all print rate cards are set'],
  why:'<b>Print base rates are set by edition circulation and readership.</b> TOI Delhi has the largest AIR (750k) of the three and offers the strongest premium inventory (a front-page jacket), so it prices highest per square centimetre — and still lands at the best CPT, because the audience scales faster than the rate.<br><br>Option B reverses cause and effect: <b>the low CPT is a consequence of the large readership, not the reason for the high rate.</b><div class="work">Rate card components\n  Base rate       per column-cm / sq cm, ROP B&W\n                  — driven by circulation + readership\n  Position premium front/back page, Page 3, jacket,\n                  solus — from +50% up to 5× base\n  Edition/day     weekend and festive editions cost more\n  Size slabs      fixed cards for full / half / quarter</div>Which is why the negotiation is never only about the headline rate: <b>volume and annual contracts, multi-edition bundling, value-adds such as bonus insertions or advertorial space, and seasonality all move the real price.</b>'},
]},

{id:'k8', cl:'Caselet 8', title:'Premium EV launch — building the mix from three currencies',
 brief:'<p>A new <b>premium electric vehicle brand</b> is launching in India.</p><p><b>TG:</b> Males &amp; females 25–44, NCCS A. <b>Markets:</b> Delhi, Mumbai, Bangalore, Chennai, Hyderabad. <b>TG insight:</b> affinity is higher among English-speaking, tech-savvy, progressive consumers. <b>Objective:</b> create awareness for the launch. <b>Budget:</b> ₹12 Cr.</p><p>Data from IRS, RAM and BARC follows. Affinity index is centred on <b>100 = average</b>.</p>',
 facts:['TG 25–44 NCCS A','5 urban metros','Budget ₹12 Cr','Objective: launch awareness'],
 tables:[
  {cap:'1 · Newspapers (IRS)',head:['Publication','Language','Market','Readership (000)','TG affinity index','Ad rate (₹/sq cm)'],
   rows:[['TOI Metro','English','Delhi / Mumbai','1,500','125','2,500'],['HT','English','Delhi','1,200','120','2,000'],['The Hindu','English','Chennai / Bangalore','800','140','1,800'],['Dainik Jagran','Hindi','All India','2,500','70','1,200']]},
  {cap:'2 · Radio (RAM)',head:['Station','Market','Reach (000)','TG affinity index','Cost / 10s (₹)'],
   rows:[['Radio Mirchi','All metros','1,200','110','5,000'],['Radio City','Delhi / Bangalore','800','125','4,500'],['Red FM','Mumbai / Chennai','900','90','4,000']]},
  {cap:'3 · Television (BARC)',head:['Channel','Genre','TVR (%)','TG affinity index','Rate / 10s (₹)'],
   rows:[['Star World','English GEC','0.8','160','2,00,000'],['CNBC TV18','English business','0.5','180','1,50,000'],['Colors','Hindi GEC','3.0','85','2,00,000'],['Sony Sports','Sports','2.5','120','2,50,000']]}],
 qs:[
 {tag:'concept',diff:'easy',
  q:'Dainik Jagran shows a TG affinity index of <b>70</b>. What does that mean?',
  opts:['The TG is under-represented in its readership relative to the general population',
        'Only 70% of its readers ever see a given advertisement',
        'It reaches 70% of the brand’s target audience nationally',
        'Its total readership is only 70% the size of the largest title listed anywhere in the set'],
  why:'<b>Affinity index = (TG share within the vehicle ÷ TG share within the universe) × 100.</b> An index of <b>70 means the TG is under-represented</b> — this audience skews away from NCCS A, English-speaking, metro consumers.<div class="work">100  exactly average\n>100 the vehicle OVER-indexes on the TG\n<100 it UNDER-indexes\n\nThe Hindu    140 ← best fit\nTOI Metro    125\nHT           120\nDainik Jagran 70 ← largest reach, poorest fit</div>And the tension the caselet is built on: <b>Dainik Jagran has the largest readership (2,500k) and the worst affinity; The Hindu has the best affinity and the smallest readership.</b><br><br>Neither number decides alone. <b>Affinity without scale delivers precision to too few people; scale without affinity delivers waste at volume.</b>'},

 {tag:'apply',diff:'hard',trap:true,
  q:'Star World has a TVR of 0.8 and an affinity index of 160. Colors has a TVR of 3.0 and an index of 85. Both cost ₹2,00,000 per 10 seconds. What follows?',
  opts:['Star World fits the TG far better but delivers a fraction of the weight per rupee',
        'Colors is strictly better, since CPRP is what decides a television buy',
        'Star World is strictly better, since audience affinity is what decides a television buy',
        'The two are equivalent, because the rate per ten seconds is identical'],
  why:'Compute both currencies before arguing.<div class="work">CPRP = rate ÷ TVR\n  Star World  2,00,000 ÷ 0.8 = ₹2,50,000\n  CNBC TV18   1,50,000 ÷ 0.5 = ₹3,00,000\n  Colors      2,00,000 ÷ 3.0 = ₹66,667 ← cheapest\n  Sony Sports 2,50,000 ÷ 2.5 = ₹1,00,000</div><b>Colors is nearly four times cheaper per rating point; Star World is nearly twice as well-matched to the TG.</b> Both statements are true, and the plan has to choose a balance rather than a winner.<br><br>The usual resolution for a premium launch: <b>use the high-affinity English channels for the core TG and add a mass GEC or sports property for scale</b>, then judge the combination on <b>cost per point of TG reach</b> rather than on raw CPRP or raw affinity.<br><br>Options B and C are both traps because each is a single-metric answer to a two-metric problem — which is the mistake the whole caselet is designed to expose.'},

 {tag:'apply',diff:'medium',
  q:'Radio City (index 125, ₹4,500) versus Red FM (index 90, ₹4,000). What is the better read for this launch?',
  opts:['Radio City — the better TG fit is worth the marginally higher cost',
        'Red FM — the lower cost per ten seconds settles it',
        'Red FM — its 900k reach beats Radio City’s 800k',
        'Neither — radio should be dropped entirely from a premium launch plan'],
  why:'<b>Radio City over-indexes on the TG (125) and Red FM under-indexes (90)</b>, for ₹500 more per 10-second spot. On a premium NCCS A launch, buying an audience that skews away from your TG to save 11% on rate is a false economy.<div class="work">Radio Mirchi  all metros · 1,200k · index 110\nRadio City    Delhi/Blr  ·   800k · index 125\nRed FM        Mum/Chen   ·   900k · index  90</div>Note the market coverage too: <b>Radio City covers Delhi and Bangalore, Red FM covers Mumbai and Chennai</b>, so a five-metro launch may need both regardless of index — at which point the argument becomes how to <b>weight</b> them, not which to pick.<br><br>Option D is the trap the paper itself sets up in its written question: radio looks weak on efficiency against TV and print, and still earns its place. That argument comes next.'},
 {open:1, marks:5, title:'The risks of an all-TV plan',
  q:'The client proposes putting the entire ₹12 Cr into television. <b>What are the risks?</b>',
  hint:'Four or five bullets, then a one-line conclusion. Use the tables — quote an index or a CPRP.',
  ans:'<p><b>It ignores the TG’s high affinity to print and radio in metros.</b> The Hindu indexes at 140 and Radio City at 125 against this NCCS A, English-speaking audience. An all-TV plan leaves the best-fitting vehicles in the set unbought.</p><p><b>TV CPRP varies sharply, and the English channels that fit the TG are both expensive and niche.</b> Star World costs ₹2,50,000 per rating point and CNBC TV18 ₹3,00,000, against Colors at ₹66,667 — so the channels that match the audience deliver very little weight per rupee, and the channel that delivers weight (Colors, index 85) does not match the audience.</p><p><b>Over-dependence on one medium removes mix diversity.</b> There is no second curve to shift reach upward once TV saturates, no contextual print environment for a considered, high-ticket purchase, and no local reinforcement layer.</p><p><b>Incremental reach is lost among urban TGs who are heavy print and radio users.</b> Weight beyond TV’s saturation point converts into frequency on people already reached, not into new reach.</p><p><b>Conclusion:</b> putting the whole budget into TV leads to inefficient spend, heavy duplication, lost incremental reach and under-use of the contextual impact print and radio offer for a premium, considered category.</p>',
  rubric:['Names the affinity gap — print and radio over-index on this TG','Quotes the CPRP problem: English channels expensive and niche, mass channels off-target','Identifies loss of incremental reach once TV saturates','Notes the loss of media-mix diversity and contextual fit for a premium category','Closes with a one-line judgement rather than trailing off in bullets']},

 {open:1, marks:5, title:'The risks of an English-only plan',
  q:'The planner proposes buying <b>only English media</b> — TOI Metro, HT, The Hindu, Star World, CNBC TV18. <b>What are the risks?</b>',
  hint:'The mirror image of the previous answer. Scale versus fit.',
  ans:'<p><b>It limits scale, because English media reach is much smaller than Hindi and regional reach.</b> Dainik Jagran alone carries 2,500k readership against The Hindu’s 800k, and Colors delivers a 3.0 TVR against Star World’s 0.8.</p><p><b>It excludes mass audiences within the 25–44 target who consume Hindi and regional television and dailies.</b> NCCS A is not the same as English-only — a large share of affluent, tech-forward buyers in these metros consume vernacular media daily.</p><p><b>Cost efficiency is lower.</b> English channels carry CPRPs of ₹2.5–3 lakh against ₹66,667 for a mass GEC, so the same budget buys a fraction of the weight.</p><p><b>It over-indexes on affinity while under-delivering awareness.</b> The objective in the brief is to <b>create awareness for a launch</b>, which is a reach objective — and an English-only plan optimises fit at the direct expense of the stated KPI.</p><p><b>Conclusion:</b> English media deliver high affinity but limit mass reach and scale. Over-concentration risks missing large parts of the TG and failing the awareness objective, so the plan should anchor on high-affinity English vehicles and add selective mass reach for scale.</p>',
  rubric:['States the scale limitation with numbers from the tables','Notes that NCCS A consumers also consume Hindi and regional media','Quotes the cost-efficiency gap (English CPRP vs mass GEC CPRP)','Ties the flaw back to the stated objective — awareness is a reach objective','Recommends a balance rather than simply rejecting English media']},

 {open:1, marks:5, title:'Keeping radio in the plan',
  q:'Radio looks weaker on efficiency than both TV and print. <b>What is your argument for keeping it?</b>',
  hint:'Four bullets on what radio uniquely does, then the one-line verdict.',
  ans:'<p><b>Radio gives local reach and frequency reinforcement at city level.</b> A five-metro launch can be tuned market by market — Radio City for Delhi and Bangalore, Red FM or Mirchi for Mumbai and Chennai — in a way a national TV buy cannot.</p><p><b>It is strong for last-mile reminder and drive-time impact.</b> The TG is a commuting, car-owning, urban audience, and an EV message reaches them in exactly the context the product occupies — the daily drive.</p><p><b>It is cost-efficient for building incremental reach.</b> Radio duplicates far less with TV than digital video or social do, so it adds genuinely new people rather than repeating exposures on an audience already covered.</p><p><b>It strengthens a 360° surround presence alongside TV and print.</b> Repetition across contexts is what builds salience for a considered, high-ticket purchase like an EV.</p><p><b>Conclusion:</b> radio is less efficient on CPRP but offers local presence, frequency reinforcement and incremental reach. It strengthens campaign effectiveness in the urban clusters where this launch has to work.</p>',
  rubric:['Names local, city-level flexibility as radio’s structural advantage','Connects drive-time listening to the TG’s context and to the product','Argues incremental reach — low duplication with the TV plan','Positions radio as a reinforcement layer in a surround plan, not a reach medium','Concedes the efficiency weakness openly instead of pretending it is not there']},
]},

{id:'k9', cl:'Caselet 9', title:'Digital performance — three platforms, one month',
 brief:'<p>A D2C brand runs one month across three platforms. Judge each on the metric that matches the job it was bought to do.</p>',
 facts:['One month · ₹15,00,000 total','CPM = cost ÷ impressions × 1,000','ROAS = revenue ÷ spend'],
 tables:[{cap:'Platform delivery',head:['Platform','Spend (₹)','Impressions','Clicks','Conversions','Revenue (₹)'],
   rows:[['Meta','5,00,000','1,00,00,000','50,000','1,000','20,00,000'],['Google Search','4,00,000','20,00,000','80,000','2,000','30,00,000'],['YouTube','6,00,000','3,00,00,000','30,000','600','9,00,000']]}],
 qs:[
 {tag:'calc',diff:'medium',
  q:'What is the <b>CPA</b> on Google Search?',
  opts:['₹200',
        '₹500',
        '₹5',
        '₹2,000'],
  why:'<b>CPA = Spend ÷ Conversions</b> = 4,00,000 ÷ 2,000 = <b>₹200</b>.<div class="work">            CPM     CTR    CPC    CPA    ROAS\nMeta         ₹50   0.50%   ₹10   ₹500   4.0x\nGoogle      ₹200   4.00%    ₹5   ₹200   7.5x\nYouTube      ₹20   0.10%   ₹20  ₹1,000  1.5x</div>Worth computing the whole grid once, because each column tells a different story and the exam can ask for any of them:<div class="work">CPM  = spend ÷ impressions × 1,000\nCTR  = clicks ÷ impressions × 100\nCPC  = spend ÷ clicks\nCPA  = spend ÷ conversions\nROAS = revenue ÷ spend</div>Google Search is best on <b>CTR, CPC, CPA and ROAS</b> and worst on CPM — which is exactly what a high-intent, bottom-funnel channel should look like.'},

 {tag:'calc',diff:'medium',
  q:'Which platform has the best <b>ROAS</b>, and why is that unsurprising?',
  opts:['Google Search at 7.5x — search captures demand that already exists',
        'Meta at 4.0x — social advertising reliably converts better than search',
        'YouTube at 1.5x — video builds the strongest purchase intent',
        'All three are equal once impressions are taken into account'],
  why:'<div class="work">Meta          20,00,000 ÷ 5,00,000 = 4.0x\nGoogle Search 30,00,000 ÷ 4,00,000 = 7.5x ← best\nYouTube        9,00,000 ÷ 6,00,000 = 1.5x</div><b>Search captures existing demand rather than creating it.</b> Someone typing the query has already been moved — by a video, a friend, a hoarding or a previous campaign — so the channel that closes the sale collects the credit.<br><br>Which is why a rising ROAS alongside falling new-customer numbers is a warning rather than a triumph: it usually means the campaign is <b>harvesting the existing base</b>. And if you cut the channels that create demand, branded search volume and search ROAS both decay over the following quarters.<br><br>The exam-ready formulation: <b>ROAS is only as reliable as the attribution model behind it</b>, and last-click attribution systematically over-credits the bottom of the funnel.'},

 {tag:'apply',diff:'hard',trap:true,
  q:'YouTube has by far the cheapest CPM (₹20) and the worst CPA (₹1,000). What is the right conclusion?',
  opts:['It was bought for reach, so judge it on reach and CPM, not on CPA',
        'It is failing badly, and the whole budget should move to Google Search',
        'Its CTR of 0.1% proves the creative is not working',
        'Cheap CPM always indicates low-quality inventory'],
  why:'<b>Stage-appropriate KPIs.</b> A video pre-roll buy exists to put the message in front of people cheaply at scale — it delivered <b>3 crore impressions at ₹20 CPM</b>, roughly ten times Google’s impression volume for 1.5 times the spend.<div class="work">Judge an awareness buy on\n  reach · frequency · CPM · VCR · recall lift\nJudge a conversion buy on\n  CPA · ROAS · conversion rate · CAC</div>Judging it on CPA is the same mistake as judging a TV campaign on ROAS: <b>“ROAS on an awareness campaign will always look poor.”</b><br><br>Option B is the trap that hollows out a funnel over time. Move everything into Search and you are <b>paying for every sale instead of earning preference</b> — and when CPA starts rising, the fix is usually in the upper funnel, not in bid optimisation.<br><br>That said, the honest planner still checks whether the video buy is doing its <i>own</i> job: 0.1% CTR is fine for pre-roll, but <b>view-through rate and brand-lift are the numbers that should have been briefed</b>, and if they were not measured, that is a real gap.'},

 {tag:'calc',diff:'medium',
  q:'What is Meta’s <b>CPM</b>, and what does the comparison with Google reveal?',
  opts:['₹50 — Meta buys impressions cheaply, Google buys intent expensively',
        '₹500 — Meta is by some distance the most expensive impression buy here',
        '₹5 — Meta is ten times cheaper than YouTube per thousand',
        '₹20 — Meta and YouTube are priced identically per thousand'],
  why:'<b>CPM = (Spend ÷ Impressions) × 1,000</b> = (5,00,000 ÷ 1,00,00,000) × 1,000 = <b>₹50</b>.<div class="work">YouTube  ₹20   cheap impressions, low intent\nMeta     ₹50   mid — reach plus targeting\nGoogle  ₹200   expensive impressions,\n               but 4% CTR and ₹5 CPC</div>The pattern is the whole point: <b>impression cost rises as intent rises</b>. Google’s CPM is ten times YouTube’s, and its CPC is four times cheaper — because the people seeing a search ad have declared what they want.<br><br>So CPM is the right comparison <i>within</i> a funnel stage and a misleading one <i>across</i> stages. Comparing a pre-roll CPM with a search CPM tells you almost nothing except that they are different products.'},
]},

{id:'k10', cl:'Caselet 10', title:'Competitive weight — SOV, SOE and share of market',
 brief:'<p>Category TV weight and spend for the last financial year. Total category = <b>2,000 GRPs</b> and <b>₹150 Cr</b>.</p>',
 facts:['SOV = brand weight ÷ category weight','ESOV = SOV − SOM','Total 2,000 GRPs · ₹150 Cr'],
 tables:[{cap:'Category competitive picture',head:['Brand','TV GRPs','Spend (₹ Cr)','Market share'],
   rows:[['Our brand','600','40','25%'],['Rival A','900','55','30%'],['Rival B','300','25','20%'],['Others','200','30','25%']]}],
 qs:[
 {tag:'calc',diff:'medium',
  q:'What is our brand’s <b>share of voice on GRPs</b>, and its <b>ESOV</b>?',
  opts:['SOV 30% and ESOV +5 points',
        'SOV 26.7% and ESOV +1.7 points',
        'SOV 30% and ESOV −5 points',
        'SOV 25% and ESOV zero'],
  why:'<div class="work">SOV (GRPs) = 600 ÷ 2,000 × 100 = 30%\nSOM                              = 25%\nESOV = SOV − SOM = +5 points</div>A <b>positive ESOV sustained over time is associated with a greater likelihood of market share growth</b> — the Binet and Field finding — though it also depends on creative quality, competitive intensity and distribution.<br><br>Note that the answer changes with the currency you choose:<div class="work">SOV by GRPs   600 ÷ 2,000  = 30.0%\nSOE by spend   40 ÷   150  = 26.7%</div>Both are legitimate. GRPs are <b>more commonly used by media planners, because they reflect the weight actually delivered rather than the money committed</b> — and the gap between the two numbers is itself informative, which is the next question.'},

 {tag:'apply',diff:'hard',trap:true,
  q:'Our SOV on GRPs is 30% but our share of expenditure is only 26.7%. What does that gap indicate?',
  opts:['We are buying our weight more cheaply than the category average',
        'Our creative is performing better than the category average this year',
        'Our reach must be higher than any competitor’s reach',
        'The two figures are inconsistent and one must be wrong'],
  why:'More weight per rupee than the category average means a <b>lower effective CPRP</b> — better buying, a cheaper daypart and channel mix, or a longer commitment negotiated at a better rate.<div class="work">Our CPRP-equivalent  ₹40cr ÷ 600 GRPs = ₹6.7 L\nRival A              ₹55cr ÷ 900 GRPs = ₹6.1 L\nRival B              ₹25cr ÷ 300 GRPs = ₹8.3 L\nOthers               ₹30cr ÷ 200 GRPs = ₹15.0 L</div>Interesting: Rival A is buying <b>even more efficiently than we are</b>, while “Others” are paying more than double our rate for their weight.<br><br>Option C is the trap. <b>More GRPs does not guarantee more reach</b> — weight can be spent on frequency against a narrow base. Establishing who actually reached more people needs reach and frequency data, on the same audience definition and the same period, which this table does not give you.'},

 {tag:'apply',diff:'medium',
  q:'Rival A runs 900 GRPs against our 600. Before matching it, what should you establish?',
  opts:['Whether it is a sustained shift or a one-off burst, and what reach it actually delivered',
        'Whether their creative agency is better resourced than ours',
        'Whether their CPRP is lower than the category average',
        'Whether the category is growing fast enough to fund a sustained competitive response from us'],
  why:'<b>Competitive monitoring is a decision loop, not a reporting exercise:</b> observe → compare → interpret → act, then observe again. The interpret step asks explicitly whether this is a <b>one-off spike or a sustained shift</b>, and whether it is a <b>reach, frequency or conversion play</b>.<br><br>Two checks before any budget moves:<div class="work">1 Compare LIKE FOR LIKE — same audience\n  definition, same markets, same period\n2 Separate WEIGHT from DELIVERY — 900 GRPs\n  could be 70% reach at 12.9 frequency, or\n  55% reach at 16.4. Very different campaigns.</div>And the warning that carries the mark: <b>“Do not let one-off competitor activity become your strategy.”</b> Define the KPI before changing spend, then measure the response.<br><br>Of the five monitoring traps, three are live here: <b>estimated spend treated as audited truth, SOV mistaken for effectiveness, and competitor action automatically copied.</b>'},
]},

{id:'k11', cl:'Caselet 11', title:'Setting the budget — three methods, one decision',
 brief:'<p>An established brand is setting next year’s media budget. <b>Brand sales ₹200 Cr</b>, category A2S norm <b>8%</b>. Total category media spend is <b>₹200 Cr</b> and the brand’s share of market is <b>18%</b>. The task-costed plan is below.</p>',
 facts:['Brand sales ₹200 Cr','A2S norm 8%','Category spend ₹200 Cr','SOM 18%'],
 tables:[{cap:'Objective & Task — the costed plan',head:['Line','Requirement','Rate','Cost'],
   rows:[['Television','1,500 GRPs','₹60,000 CPRP','?'],['Digital video','500 mn impressions','₹120 CPT','?'],['Total','—','—','?']]}],
 qs:[
 {tag:'calc',diff:'hard',
  q:'What does the <b>Objective &amp; Task</b> method give as the budget?',
  opts:['₹15 Cr — ₹9 Cr television plus ₹6 Cr digital',
        '₹16 Cr — matching the A2S norm of 8% of sales',
        '₹36 Cr — matching an 18% share of category spend',
        '₹9 Cr — television only, with digital treated as added value'],
  why:'<div class="work">TELEVISION  1,500 GRPs × ₹60,000 CPRP\n            = ₹9,00,00,000 = ₹9 Cr\nDIGITAL     500,000,000 impressions\n            ÷ 1,000 × ₹120 CPT\n            = ₹6,00,00,000 = ₹6 Cr\n                            ─────────\nO&T BASELINE                = ₹15 Cr</div>Note the two different costing bases, which the exam likes to mix in one table: <b>GRPs are costed on CPRP, impressions on CPT (per thousand)</b>, and an acquisition-led digital line would instead be costed on <b>CAC × users</b>.<br><br>The other two numbers in the options are the other two methods, and both are worth computing:<div class="work">A2S / % of sales  8% × ₹200 Cr    = ₹16 Cr\nCompetitive parity 18% × ₹200 Cr  = ₹36 Cr</div>'},

 {tag:'apply',diff:'medium',
  q:'O&amp;T says ₹15 Cr, A2S says ₹16 Cr, parity says ₹36 Cr. What is the right response?',
  opts:['Take O&T as the baseline, note the parity gap, and accept the SOV risk knowingly',
        'Take the parity figure, since being outspent in a category guarantees share loss',
        'Average the three methods and present ₹22.3 Cr to finance',
        'Take the lowest figure, since it is the most defensible to finance'],
  why:'<b>Brands always use a blend — no single method captures the full picture.</b><div class="work">STEP 1 BASELINE       Objective & Task\n  what the job actually costs → ₹15 Cr\nSTEP 2 SANITY CHECK   Competitive parity\n  what the category is spending → ₹36 Cr\nSTEP 3 FINANCE        Affordable ceiling\n  present within it, using O&T as evidence</div>O&amp;T and A2S converging at ₹15–16 Cr is a <b>high-confidence signal</b> that the task is correctly costed. The parity figure sits far above both, which does not automatically mean spend ₹36 Cr — it means you are choosing to run at a <b>share of voice below your share of market</b>, and that choice should be <b>documented as a knowing risk rather than an oversight</b>.<br><br>Averaging three methods (option C) produces a number no method supports and no argument defends. <b>Pick a primary method, name a secondary check, and state the risk you are accepting.</b>'},

 {tag:'apply',diff:'medium',
  q:'For a brand-new product launch instead, which pairing does the course recommend?',
  opts:['Objective & Task as the primary, with the affordable ceiling as the check',
        'Percentage of sales as the primary method, with competitive parity as the check',
        'Competitive parity as the primary, with percentage of sales as the check',
        'The affordable ceiling as the primary, with no secondary check needed'],
  why:'<b>A launch has no sales history, so any percentage of sales breaks down immediately.</b> The launch goal builds the requirement; finance then confirms what can be funded.<div class="work">SITUATION              PRIMARY        CHECK\nEstablished FMCG,      % of sales     parity\n  stable category\nNew brand / launch     O&T            affordable\nCategory under attack  parity         O&T\nStartup, limited funds affordable     O&T</div>The logic behind every row: <b>the primary method answers “how much does the job need?” and the check answers “is that number survivable?”</b> — either against the competition or against the bank balance.<br><br>Also worth carrying into the exam: <b>% of sales is backward-looking and cuts spend exactly when the brand is struggling most</b>, which is why it suits stable, repeat-purchase categories and almost nothing else.'},

 {tag:'apply',diff:'medium',trap:true,
  q:'The ₹15 Cr is approved. Finance asks for the funnel split for this established brand in a competitive category. What do you propose?',
  opts:['Roughly 45 / 30 / 25 across awareness, consideration and conversion',
        'An even 33 / 33 / 34 split, since all three funnel stages matter equally',
        'Roughly 70 / 20 / 10, because awareness always leads',
        'Roughly 10 / 20 / 70, because the brand is already established'],
  why:'The indicative bands are <b>TOF 40–60%, MOF 25–35%, BOF 20–30%</b>, and an established brand under competitive pressure sits mid-range — enough top-funnel weight to hold salience against rivals, a real mid-funnel layer, and bottom-funnel weight to defend at the point of sale.<div class="work">Stride’s worked split on ₹20 Cr:\n  Awareness     45% = ₹9 Cr\n  Consideration 30% = ₹6 Cr\n  Conversion    25% = ₹5 Cr</div>Option C is a <b>launch</b> profile (or a government awareness campaign at 70–80% TOF). Option D is the error that hollows out a funnel: <b>brands obsessed with ROAS cut top-funnel spend, shrinking the funnel over time</b> — short-term efficiency, long-term brand erosion. The stated fix is to <b>maintain 40–50% TOF even in performance-heavy plans</b>.<br><br>And the mid-funnel is the stage most often skipped, because its ROI is slower and messier to prove — leaving aware consumers who never build enough preference to convert.'},
]},

/* ============ SECTION 01 · INDIA MEDIA LANDSCAPE ============ */

{t:'land',tag:'concept',diff:'easy',
 q:'India’s advertising revenue in 2025 was about <b>₹1,50,000 crore</b>. Rank the top three media by share.',

{t:'land',tag:'concept',diff:'medium',

       'The suspension of the Indian Readership Survey since 2019',

 why:'The three drivers, in the deck’s own order:<div class="work">01 RETAIL MEDIA — Amazon, Flipkart,\n   Meesho, Blinkit, Swiggy Instamart\n   unlocked a new ad channel with\n   measurable sales lift\n02 PERFORMANCE MARKETING — pay only\n   for outcomes (clicks, leads, installs,\n   purchases), making digital the default\n   for growth-focused CFOs\n03 SME ADVERTISERS — low entry costs on\n   Google and Meta brought millions of\n   kirana stores and D2C brands online;\n   India’s SME digital ad base grew 3x\n   in five years</div>Notice all three are about <b>who can now advertise and what they can now prove</b> — not about digital being cheaper or flashier.'},

{t:'land',tag:'concept',diff:'medium',trap:true,
 q:'“Linear TV delivers reach. Connected TV delivers relevance and results.” What does the deck conclude from this?',

 why:'The strategic takeaway is stated exactly that way: <b>“The future of TV is not linear vs. connected — it’s linear + connected.”</b><div class="work">LINEAR TV — the scale anchor\n  mass reach, vital for regional markets\n  and live sports\n  0% ad revenue growth; structural headwinds\nCONNECTED TV — the growth frontier\n  grew 42% in 2025 (34% growth in CTV homes)\n  captured 27% of large-screen ad revenue,\n  up from 19%\n  targeted, premium digital yields on a\n  legacy screen size</div>Which is why the deck says <b>cross-screen planning is now critical</b> and household-level targeting is improving — with the catch that <b>cross-screen reach and frequency need deduplication</b>.'},

{t:'land',core:0,tag:'concept',diff:'medium',
 q:'Print’s paradox in India includes a “<b>trust refuge</b>” argument. What does that mean for advertisers?',

{t:'land',tag:'apply',diff:'medium',

{t:'land',core:0,tag:'concept',diff:'easy',

/* ============ SECTION 02 · WHAT MEDIA PLANNING IS ============ */

{t:'plan',tag:'concept',diff:'easy',
 q:'The course defines media planning as determining <b>how, when, where and how often</b> to deliver a message — with one more clause. What is it?',
 opts:['at the most efficient cost',
       'using the widest possible channel mix',
       'with the highest possible frequency',
       'across every stage of the marketing funnel'],
 why:'<b>“Media planning is the process of determining how, when, where, and how often to deliver an advertising message to a target audience — at the most efficient cost.”</b> The efficiency clause is what makes it planning rather than wishing.<div class="work">WHO       define and understand the TG\nWHAT      select message and format\nWHERE     choose channels and vehicles\nWHEN      timing, flighting, frequency\nHOW MUCH  allocate budget for impact</div>And the framing line to quote: <b>media planning bridges business objectives and media execution</b>. The deck opens with the same idea from the consumer side — <b>consumers rarely buy because of one advertisement; they buy because of a series of connected media experiences</b>, and media planning is designing those experiences deliberately.'},

{t:'plan',core:0,tag:'concept',diff:'medium',
 q:'Across the deck’s four eras, how did the definition of success change?',

{t:'plan',tag:'concept',diff:'easy',
 q:'Rank the three data types by the value the deck assigns them.',

{t:'plan',tag:'apply',diff:'medium',trap:true,

{t:'plan',tag:'concept',diff:'medium',

       'Kantar TGI',
       'GA4',
       'BARC'],
 why:'<b>Pathmatics — digital ad intelligence.</b> Continuous coverage of digital advertising with <b>spend, creatives and SOV</b>; strength is its <b>creative library</b>, limitation is that <b>spend is estimated</b>.<br><br>The rest of the landscape, by job:<div class="work">Kantar TGI  consumer insight — 60,000\n  sample, quarterly, psychographics and\n  media consumption. NOT campaign measurement.\nSimilarweb  website intelligence, estimated\nSensor Tower app downloads and revenue\nQoruz       influencer discovery, Indian creators\nGA4         owned analytics, real time, 1st-party\nComscore    independent cross-platform digital\n  audience measurement\nVTION       OBSERVED digital behaviour, not\n  claimed — opt-in smartphone panel\nTAM AdEx/MAP cross-media spend estimates and SOV\nSocial listening Meltwater, Brandwatch,\n  Talkwalker, Sprinklr</div>A useful exam habit: every one of these tools has a stated <b>limitation</b>, and most of them are the word <b>“estimated”</b>.'},

/* ============ SECTION 03 · KEY MEDIA METRICS ============ */

{t:'metric',tag:'calc',diff:'easy',
 given:['TV 300,000','Radio 250,000','Overlap 80,000'],
 q:'TV reaches 300,000 people, radio 250,000, and 80,000 were reached by both. What are <b>net reach</b> and <b>gross reach</b>?',
 opts:['Net 470,000 and gross 550,000',
       'Net 550,000 and gross 470,000',
       'Net 630,000 and gross 550,000',
       'Net 470,000 and gross 390,000'],
 why:'<div class="work">NET REACH = unique people, no one\n  counted twice\n  300,000 + 250,000 − 80,000 = 470,000\n  (47% net reach of a 1,000,000 TG)\n\nGROSS REACH = simple sum, duplication\n  included\n  300,000 + 250,000 = 550,000</div><b>Net is always the smaller number</b>, and the gap between gross and net is exactly the duplication in the schedule. Comparing the two is how a planner sees how much overlap a vehicle combination carries.<br><br>Keep <b>impressions</b> separate again: those count <i>every serving of the ad</i>, regardless of who saw it or how often — the currency behind reach, frequency and CPM, but on its own it reveals no unique audience at all.'},

{t:'metric',tag:'calc',diff:'easy',
 given:['4,500,000 impressions','900,000 net reach'],
 q:'A campaign delivers 4.5 million impressions and reaches 900,000 unique people. What is average frequency?',
 opts:['5.0',
       '0.2',
       '4.5',
       '9.0'],
 why:'<b>Frequency = Gross Reach ÷ Net Reach</b> — the average number of times each reached person was exposed. Also called <b>average OTS (opportunity to see)</b>.<div class="work">4,500,000 ÷ 900,000 = 5.0\n→ an average of 5 exposures per person reached</div>Why it matters beyond arithmetic: <b>repeated exposure builds familiarity, anchoring your brand in consumer memory and fostering trust</b> — critical in a cluttered environment. The deck calls frequency <b>a core driver of communication effectiveness</b>, not just a planning metric.<br><br>When to push reach versus frequency: <b>reach</b> for a new product or creative and short sales promotions; <b>frequency</b> for staying top of mind on impulse or low-loyalty purchases, and for complex messages in cluttered environments.'},

{t:'metric',tag:'calc',diff:'medium',
 given:['1× 180,000','2× 200,000','3× 180,000','4× 140,000','5+ 200,000','Total reach 900,000'],
 q:'Using that exposure distribution, what is <b>effective reach at 3+</b>?',
 opts:['58%',
       '42%',
       '20%',
       '78%'],
 why:'Effective reach counts only the people at or above the threshold — here 3, 4 and 5+.<div class="work">3 exposures  180,000\n4 exposures  140,000\n5+ exposures 200,000\n             ───────\n             520,000\n\n520,000 ÷ 900,000 = 58%</div>The other 42% of those reached saw it only once or twice — below the threshold the planner considers effective.<br><br>The principle: <b>too few exposures = no recall; too many = wasted spend or irritation.</b> Effective frequency is <b>the minimum number of exposures required to influence behaviour, often set at 3+</b> — with the scheduling deck adding the crucial caveat that 3+ is a <i>starting point, not a rule</i>.'},

{t:'metric',tag:'calc',diff:'easy',
 given:['Reach 40%','Frequency 5'],
 q:'A TV flight reaches 40% of the target at an average frequency of 5. How many GRPs is that?',
 opts:['200 GRPs',
       '45 GRPs',
       '8 GRPs',
       '500 GRPs'],
 why:'<b>GRP = Reach (%) × Frequency</b> → 40 × 5 = <b>200 GRPs</b>.<br><br>GRP is the <b>total weight</b> of a flight — the sum of all TVRs delivered across every spot, with duplication included. A viewer who sees the ad three times contributes three times over. So a brand buying 1,400 GRPs is not reaching 1,400% of anyone; it is buying that much cumulative weight.<br><br>The relationship that holds the whole of TV planning together:<div class="work">REACH × FREQUENCY = GRP\nFrequency = GRP ÷ Reach\nReach     = GRP ÷ Frequency</div>For a fixed GRP budget, chasing wider reach trades off against building deeper frequency. Every plan is a deliberate choice along that line.'},

{t:'metric',tag:'apply',diff:'medium',trap:true,
 given:['A: 75% reach × 4','B: 50% reach × 6'],
 q:'Campaign A delivers 75% reach at frequency 4. Campaign B delivers 50% at frequency 6. Both are 300 GRPs. What does this show?',
 opts:['GRPs hide the reach–frequency mix, so never evaluate on GRPs alone',
       'The two campaigns will perform identically, since the total weight is equal',
       'Campaign B is better because higher frequency builds more memory',
       'Campaign A is better because reach always beats frequency'],
 why:'<b>Same GRPs, very different communication outcomes.</b> A talks to three-quarters of the audience four times; B talks to half the audience six times. Those are different campaigns with the same price tag.<br><br>The deck’s instruction: <b>never evaluate a campaign using GRPs alone. Always look at reach, frequency, effective reach (3+, 5+), audience quality, cost and business outcomes.</b><br><br>Which of A or B is better depends entirely on the objective — a launch needing broad awareness wants A; a complex message in a cluttered category may want B. That is why the objective is set <i>before</i> the weight, never after.'},

{t:'metric',core:0,tag:'calc',diff:'hard',
 given:['10 people × 30 min','10 people × 15 min','20 people × 5 min','Universe 100'],
 q:'40 of 100 people sampled a 30-minute programme as shown. What is the <b>time-weighted TVR</b>?',
 opts:['18.3',
       '40.0',
       '13.8',
       '55.0'],
