 why:'The old model asked “did you watch the programme?”. The new model asks <b>“how much of the programme did you watch?”</b> — every viewing minute contributes.<div class="work">STEP 1 — total viewing minutes\n  (10×30) + (10×15) + (20×5)\n  = 300 + 150 + 100 = 550 minutes\n\nSTEP 2 — maximum possible viewing\n  100 viewers × 30 minutes = 3,000\n\nTIME-WEIGHTED TVR\n  550 ÷ 3,000 × 100 = 18.3</div>So although <b>40% sampled the programme, the time-weighted TVR is only 18.3</b> — because much of the audience did not stay. Someone watching 25 minutes contributes far more than someone watching 2.<br><br>And the planning-relevant footnote: <b>TVRs are available for the ad breaks too, and TV plans are built on those.</b>'},

{t:'metric',tag:'calc',diff:'easy',
 given:['Cost ₹5,00,000','250 GRPs'],
 q:'A TV plan costs ₹5,00,000 and delivers 250 GRPs. What is CPRP, and what is it used for?',
 opts:['₹2,000 — comparing buying efficiency across markets or vendors',
       '₹2,000 — measuring how many unique people the television plan reached',
       '₹1,250 — comparing creative performance across channels',
       '₹20,000 — setting the frequency cap for the campaign'],
 why:'<b>CPRP = Total Media Cost ÷ GRPs Delivered</b> = 5,00,000 ÷ 250 = <b>₹2,000</b>.<br><br>It is the price of one rating point against a defined target group, and it is <b>the primary negotiation currency between buyers and broadcasters</b> — varying by channel, daypart, season and TG.<br><br>Rearranged, it is how a budget becomes a weight target:<div class="work">Total GRPs affordable = Budget ÷ CPRP\ne.g. ₹89,88,000 ÷ ₹6,420 blended CPRP\n     = 1,400 GRPs</div>That single number becomes the ceiling for every step that follows in the TV plan — channel split, weekly allocation, and the reach the plan can realistically claim.'},

{t:'metric',tag:'calc',diff:'easy',
 given:['Cost ₹4,000','2,000,000 impressions'],
 q:'A display campaign costs ₹4,000 and delivers 2 million impressions. What is the CPM?',
 opts:['₹2.00',
       '₹500',
       '₹0.002',
       '₹20.00'],
 why:'<b>CPM = (Total Cost ÷ Total Impressions) × 1,000</b> = (4,000 ÷ 20,00,000) × 1,000 = <b>₹2.00</b> per thousand impressions.<br><br>The “M” is the Roman thousand, not million — forgetting the ×1,000 is what produces the ₹0.002 answer.<br><br>CPM is the standard efficiency metric for <b>awareness-focused</b> digital buys, letting you compare the price of reach across publishers and formats on equal footing. Its funnel siblings:<div class="work">CTR = (Clicks ÷ Impressions) × 100\nCPC = Spend ÷ Clicks\nClick-to-Cart = Add-to-carts ÷ Clicks × 100\nCPA/CPL = Spend ÷ Conversions</div>'},

{t:'metric',tag:'calc',diff:'medium',
 given:['TG usage 35%','Population usage 10%'],
 q:'35% of your target group listens to a podcast; 10% of the general population does. What is the affinity index, and what should you do?',
 opts:['350 — prioritise it, since the target over-indexes strongly',
       '350 — avoid it, since the total audience is too small',
       '28 — deprioritise it, since the index sits far below the average of 100',
       '25 — treat it as an average-performing vehicle'],
 why:'<b>Affinity Index = (% of target using it ÷ % of general population using it) × 100</b> = (35 ÷ 10) × 100 = <b>350</b>. Sports fans here are <b>3.5× more likely than average</b> to listen.<div class="work">100  exactly average\n>100 the vehicle OVER-indexes on your TG\n<100 it under-indexes</div>The planning instruction: <b>prioritise vehicles that over-index with your specific target, even if their total audience is smaller.</b> A general entertainment show may have a huge audience and a poor index for “Men 18–24”; a sports property reaches fewer people and indexes far higher.<br><br>Affinity is one of the three lenses in the media-mix scorecard — <b>Reach (how many), Affinity (how well it fits), Time Spent (how much opportunity)</b>.'},

{t:'metric',tag:'calc',diff:'medium',trap:true,
 given:['Spend ₹10,00,000','Revenue ₹25,00,000'],
 q:'A campaign spends ₹10 lakh and generates ₹25 lakh in revenue. What are <b>ROI</b> and <b>ROAS</b>?',
 opts:['ROI 150% and ROAS 2.5x',
       'ROI 250% and ROAS 2.5x',
       'ROI 150% and ROAS 1.5x',
       'ROI 25% and ROAS 25x'],
 why:'Two different questions, and mixing them up is the classic slip.<div class="work">ROI  = Net Profit ÷ Investment × 100\n  Net profit = 25,00,000 − 10,00,000\n             = 15,00,000\n  ROI = 15,00,000 ÷ 10,00,000 × 100\n      = 150%\n\nROAS = Revenue ÷ Ad Spend\n     = 25,00,000 ÷ 10,00,000\n     = 2.5x</div><b>ROI subtracts the cost; ROAS does not.</b> ROI of 150% means every ₹1 spent returned ₹1.50 of <i>profit on top</i> of the original spend; ROAS of 2.5x means ₹2.50 of <i>revenue</i> per ₹1.<br><br>The deck’s health warning on ROAS: it is <b>only as reliable as the attribution model behind it</b> — and a rising ROAS with falling new customers usually means you are <b>harvesting existing demand</b>, not growing.'},

{t:'metric',tag:'apply',diff:'medium',
 given:['SOV 40%','Market share 25%'],
 q:'Brand A has 40% share of voice and 25% market share. What is ESOV, and what does the research say about it?',
 opts:['+15 points — sustained positive ESOV is associated with share growth',
       '+15 points — a reliable signal the brand is wasting media money',
       '−15 points — the brand is under-investing against its market position',
       '1.6 — the ratio shows advertising is 60% more efficient than rivals'],
 why:'<b>ESOV = SOV − Market Share</b> = 40% − 25% = <b>+15 points</b>.<br><br>The deck attributes the finding to the IPA and to <b>Les Binet and Peter Field</b>: <b>a positive ESOV, sustained over time, is associated with a greater likelihood of market share growth</b> — though it also depends on creative quality, competitive intensity and distribution.<br><br>The framing matters. A +15 ESOV is <b>an over-investment signal worth investigating</b>, not automatically a mistake: a challenger brand often plans a deliberately positive ESOV in order to grow.<br><br>And SOV is <b>competitive, not absolute</b>: 500 GRPs is 60% SOV in a quiet category and 20% in a noisy one. Same weight, very different visibility. The currency changes by medium too — <b>spend, GRPs, impressions, search impressions, mentions or shelf visibility</b> can all serve as valid SOV currencies.'},

/* ============ SECTION 04 · STRATEGY, AUDIENCE & OBJECTIVES ============ */

{t:'strat',tag:'concept',diff:'easy',
 q:'Put the <b>hierarchy of objectives</b> in the right order.',
 opts:['Business → Marketing → Communication → Media objective → Strategy → Plan',
       'Marketing → Business → Media objective → Communication → Plan → Strategy',
       'Communication → Business → Marketing → Strategy → Media objective → Plan',
       'Business → Communication → Marketing → Strategy → Plan → Media objective'],
 why:'<div class="work">1 BUSINESS       the commercial goal\n2 MARKETING      how to deliver it\n3 COMMUNICATION  what people should\n                 know / think / feel\n4 MEDIA OBJECTIVE what media must deliver,\n                 quantified — to how many\n                 and how often\n5 MEDIA STRATEGY the gameplan\n6 MEDIA PLAN     the execution detail</div>The rule attached to it: <b>media planning does not begin with selecting channels. It begins with understanding the business objective</b> — and every level must logically support the level above it.<br><br>The worked example to memorise: <b>₹100 crore sales in Year 1 → 2 lakh first-time buyers and 15% repeat → awareness from 12% to 35% → reach 70% of urban adults 18–35 at frequency 4 within 10 weeks → digital video and creators for awareness, search and retail media for conversion → YouTube, Instagram creators, TV, Blinkit and Zepto.</b><br><br>Media objectives are always written in the <b>SMART</b> framework.'},

{t:'strat',tag:'concept',diff:'medium',
 q:'Where does <b>media strategy</b> sit?',
 opts:['Between marketing strategy and the media plan',
       'Before marketing strategy, since media decides the goal',
       'After the media plan, as a post-campaign rationale',
       'Alongside creative strategy, with no link to the plan'],
 why:'<div class="work">MARKETING STRATEGY — the goal: what\n  business result and who we target\nMEDIA STRATEGY — the ROADMAP: media’s\n  role, funnel emphasis, channel mix,\n  budget and measurement\nMEDIA PLAN — the execution: specific\n  vehicles, dates, rates, placements</div><b>Media strategy lives entirely in the middle box.</b> The integrated framework puts it more bluntly: <b>a media plan tells us what we will buy and when; media strategy explains why those choices make sense.</b> Strategy is not a channel list.<br><br>Its <b>eight elements</b> are worth being able to list: target audience, role of media, channel mix, reach &amp; frequency, geography, timing/flighting, budget allocation, measurement &amp; evaluation.'},

{t:'strat',tag:'apply',diff:'medium',
 q:'Which funnel split best matches a <b>new FMCG brand launch</b>?',
 opts:['55–65% awareness, 20–30% consideration, 10–20% conversion',
       '10–20% awareness, 15–25% consideration, 60–75% conversion',
       '20–30% awareness, 20–30% consideration, 40–60% conversion',
       '25–35% awareness, 30–40% consideration, 30–40% conversion'],
 why:'Awareness must lead, because nobody knows the brand yet. The deck’s illustrative ranges:<div class="work">New FMCG launch      55–65 / 20–30 / 10–20\nNew D2C app/fintech  40–50 / 20–30 / 25–35\nGrowth brand         30–40 / 25–35 / 30–40\nMature FMCG (Maggi)  20–30 / 20–30 / 40–60\nE-commerce sale      10–20 / 15–25 / 60–75\nLuxury launch        45–55 / 30–35 / 15–25\nGovt awareness       70–80 / 15–20 /  5–10\nB2B SaaS lead gen    25–35 / 30–40 / 30–40</div>The other options are, in order, the <b>e-commerce sale</b>, the <b>mature FMCG brand</b> and the <b>B2B SaaS</b> profile.<br><br>The caveat the deck repeats: <b>there are no fixed benchmarks — allocation follows category, competitive intensity and the media objective.</b> Budget split is a strategic decision, not an accounting one.'},

{t:'strat',tag:'apply',diff:'hard',trap:true,
 scene:{cl:'Case Study 01 · three parts',h:'BeanBrew Coffee',body:'BeanBrew launches a ready-to-drink coffee with an <b>awareness objective</b>: reach 65% at 3+ over eight weeks, mix of TV 40%, YouTube 30%, OOH 20%, influencers 10%. Mid-campaign the results come in: <b>ROAS 4.5x on search, CPA ₹380, 20,000 units sold</b>, and the marketing manager proposes moving the entire budget into Search, which has the highest ROAS of any line.'},
 q:'<b>Part 1.</b> Is moving 100% of budget into Search a good decision?',
 opts:['No — search captures existing demand but does not create future demand',
       'Yes — search is comfortably the most profitable channel measured by ROAS',
       'Yes — ROAS is the only KPI that ultimately matters',
       'No — the budget should go into influencers instead'],
 why:'This is the deck’s own multiple choice, and the answer is stated in full: <b>“No. Search captures existing demand but does not create future demand. Over time, branded searches and sales will decline if awareness investment stops.”</b><br><br>Search harvests the demand that awareness media created. Cut the awareness and you are harvesting a field nobody is planting. The budgeting deck makes the same point from the cost side: <b>if CPA keeps rising, the fix is usually in the upper funnel, not in bottom-funnel bid optimisation.</b><br><br>The related trap on keywords: should BeanBrew bid on “BeanBrew Cold Coffee” or “Best Ready-to-Drink Coffee”? <b>Both — branded search protects existing demand, high-intent generic search acquires new customers.</b>'},

{t:'strat',tag:'apply',diff:'medium',
 q:'<b>Part 2.</b> BeanBrew’s ROAS rises from 3.5x to 5.2x while new customers fall 20%. The most likely explanation is:',
 opts:['The campaign is converting existing brand users rather than acquiring new ones',
       'Awareness has increased dramatically right across the target audience in all markets',
       'Click-through rate has doubled on the search campaigns',
       'Viewability improved across the programmatic display buy'],
 why:'<b>A high ROAS can indicate harvesting existing demand instead of growing the customer base.</b> The cheapest conversions are always the people who were going to buy anyway — so a campaign that narrows onto them looks more efficient while the business gets smaller.<br><br>This is why the strategy deck insists on <b>stage-appropriate KPIs</b>. Judging an awareness campaign by ROAS will always flatter the bottom of the funnel and quietly starve the top. The four questions the deck poses about mid-campaign results are worth memorising:<div class="work">“We have 15 million impressions.”\n  → how many PEOPLE? Impressions ≠ reach\n“We met the reach targets.”\n  → did they REMEMBER you? Reach ≠ salience\n“Our CTR was poor.”\n  → was the AWARENESS objective met?\n    CTR is not an awareness KPI\n“Sales did not increase.”\n  → was a SALES objective ever set?</div>'},

{t:'strat',core:0,tag:'concept',diff:'medium',
 q:'<b>Part 3.</b> BeanBrew’s awareness stage is reviewed every two weeks, conversion daily. Why does cadence shorten down the funnel?',
 opts:['Fast-moving metrics need fast review, and lower-funnel data arrives quicker',
       'Awareness campaigns cannot be optimised once they have launched',
       'Conversion budgets are always the largest and therefore need much closer control',
       'Brand-lift studies are cheaper to run than platform dashboards'],
 why:'<b>Leading indicators</b> steer mid-flight; <b>lagging indicators</b> judge the result. The higher up the funnel, the longer you wait to know.<div class="work">STAGE         LEADING (optimise)\n              LAGGING (evaluate)\n              ATTRIBUTION CONFIDENCE\nAwareness     reach, frequency, CPM, VCR\n              ad recall, awareness lift\n              LOWEST — MMM or brand-lift study\nConsideration CTR, engagement, VCR, LPV\n              search lift, qualified visits\n              MEDIUM — multi-touch attribution\nConversion    add-to-cart, checkout starts,\n              CPA trend\n              sales, ROAS, profit\n              HIGHEST — platform attribution\n              plus incrementality test</div>Hence the review rhythm: awareness every two weeks, consideration weekly, conversion daily or weekly. And the action trigger is agreed <b>before</b> the campaign runs, so a mid-flight dip has a pre-decided response.'},

{t:'strat',tag:'concept',diff:'medium',trap:true,
 q:'“Women aged 25–45 in urban metros” versus “yoga enthusiasts in that group watching morning television”. These are, in order:',
 opts:['Target market and target audience',
       'Target audience and target market',
       'Customer segmentation and target market',
       'Target audience and customer segmentation'],
 why:'Three distinct terms doing three jobs:<div class="work">TARGET MARKET — business and product\n  strategy. The broad group sharing common\n  needs. “Women 25–45, urban metros.”\nTARGET AUDIENCE — advertising and media\n  strategy. The specific subset reached by a\n  particular message or channel. “Yoga\n  enthusiasts watching morning TV.”\nCUSTOMER SEGMENTATION — loyalty and\n  lifetime value. Dividing EXISTING buyers by\n  prior behaviour and active/lapsed status.\n  “Repeat purchasers of eco-friendly mats.”</div>The one that catches people is <b>customer segmentation</b>: it works on people who have <i>already bought</i>, which is why it belongs to retention rather than acquisition.<br><br>And the deck’s standard for a usable audience definition: not <b>“women 25–35”</b> but <b>“working mothers in metros who seek safe, natural baby-care products, compare reviews online and shop via quick-commerce”</b> — who they are, what they need, how they behave, where their attention is, and what signals intent.'},

{t:'strat',core:0,tag:'apply',diff:'medium',
 q:'Spotify Wrapped targets on songs played, skips, repeat plays and listening times rather than age and city. The deck’s takeaway is:',
 opts:['Behaviour predicts future actions better than demographics',
       'Demographics are no longer collected by modern platforms',
       'Psychographics and behaviour are effectively the same thing',
       'Personalisation only works for entertainment categories'],
 why:'<b>“Behaviour predicts future actions better than demographics.”</b> Demographics tell you <i>who someone is</i>, not <i>what they actually do</i> — and behavioural segmentation groups people by category usage, purchase frequency, loyalty, basket size, occasion, promotion response and media consumption.<br><br>The four profiling layers build on each other rather than compete:<div class="work">DEMOGRAPHIC   age, gender, NCCS, geography,\n  life stage — observable and sizeable, but\n  explains no motivation\nPSYCHOGRAPHIC values, attitudes, aspirations,\n  identity — fitness-first, conscious consumer,\n  status seeker, tradition-led\nBEHAVIOURAL   what they actually do —\n  the most reliable predictor\nPERSONA       the bridge from data to action:\n  name, category relationship, pain point,\n  trigger, media map, message hook</div>And the sourcing rule: <b>good audience definition is triangulated — research explains why, behaviour shows what, media data shows where.</b>'},

{t:'strat',tag:'apply',diff:'hard',
 q:'Which of these is a <b>strong</b> media objective?',
 opts:['Reach 75% of new category entrants at 3+ frequency in priority markets during the six-week launch',
       'Increase brand awareness significantly among our core consumers across all priority markets this year',
       'Become the market leader in the minds of Indian consumers',
       'Grow sales by 15% through an integrated media campaign'],
 why:'A complete media objective answers <b>seven questions</b>: who must be influenced, what media must make happen, how many, how often, where, when, and how success is judged.<div class="work">Weak  “Increase awareness”\nStrong “Reach 75% of new category entrants\n  at 3+ frequency in priority markets during\n  the six-week launch window”\n\nWeak  “Drive conversions”\nStrong “Generate 30,000 qualified visits from\n  high-intent prospects at CPA below ₹1,500\n  over twelve weeks”</div>The last option is the subtler trap: <b>“grow sales by 15%” is a business objective, not a media objective.</b> The deck lists using sales growth as a media objective as its first common trap — the fix is to <b>translate it into the media delivery that can influence sales</b>.<br><br>The test to apply: <b>a good media objective is specific enough that two planners would build broadly similar plans from it.</b>'},

{t:'strat',tag:'apply',diff:'medium',trap:true,
 q:'Sales are flat. Diagnosis shows the product is available in only 20% of target outlets. What should the media objective do?',
 opts:['Recognise that media is not the primary answer to a distribution problem',
       'Increase reach and frequency until sales respond',
       'Shift the entire budget into retail media and quick-commerce placements instead',
       'Raise frequency in the markets with the weakest distribution'],
 why:'The deck draws a hard line around what media can and cannot do:<div class="work">MEDIA CAN INFLUENCE\n  attention · memory · salience ·\n  consideration · search · visits · intent ·\n  purchase prompt · repeat contact\nMEDIA CANNOT FIX ALONE\n  weak product · uncompetitive price ·\n  POOR DISTRIBUTION · bad experience ·\n  low availability · slow fulfilment</div>Its own worked version: “if sales are flat because awareness is low, media must create reach and memory; if sales are flat because repeat is weak, media can engage existing buyers; <b>if distribution is poor, media may not be the primary answer.</b>”<br><br>There is also a practical trap on the list: <b>ignoring geography or availability — set objectives only where the business can fulfil demand.</b> Advertising into markets you cannot service buys competitors’ sales.'},

/* ============ SECTION 05 · MARKET PRIORITISATION ============ */

{t:'mkt',tag:'calc',diff:'medium',
 given:['TG population 3%','Category sales 4%','Brand sales 7%'],
 q:'Kerala holds 3% of the TG population, 4% of category sales and 7% of the brand’s sales. What are CDI and BDI?',
 opts:['CDI 133 and BDI 233',
       'CDI 233 and BDI 133',
       'CDI 75 and BDI 43',
       'CDI 133 and BDI 175'],
 why:'<div class="work">CDI = % of CATEGORY sales in the market\n      ÷ % of TG population × 100\n    = (4 ÷ 3) × 100 = 133\n\nBDI = % of BRAND sales in the market\n      ÷ % of TG population × 100\n    = (7 ÷ 3) × 100 = 233</div><b>CDI is a market characteristic</b> — is this a good market for the category at all? <b>BDI is a business characteristic</b> reflecting distribution, heritage, pricing and past media weight — how strong is our brand here?<br><br>Reading the scale: <b>100 is the norm by construction</b>. Below 70–90 is under-developed; 90–110 is at the norm; above 110 is over-developed.<br><br>Kerala here: the category over-indexes at 133, and the brand over-indexes even harder at 233. <b>BDI ÷ CDI = 1.75</b> — the brand is outperforming category demand by 75%. This is <b>a market to defend, not to grow</b>; incremental media buys hit diminishing returns.'},

{t:'mkt',tag:'apply',diff:'medium',
 given:['Maharashtra: 9% pop, 12% category, 8% brand'],
 q:'Maharashtra shows CDI 133 and BDI 89. What is the correct read?',
 opts:['High demand exists and the brand lags — the priority investment market',
       'The brand is over-developed here, so defend existing share at efficient weight',
       'Both category and brand are weak — test and learn only',
       'The market is at the national norm, so the objective decides'],
 why:'<b>High CDI, low BDI is the growth quadrant</b>: demand exists and the brand is not capturing it. The deck’s prescription — <b>attack: drive ESOV, focus on reach, localise creative and language.</b><div class="work">High CDI · High BDI  DEFEND leadership.\n  Maintain visibility; competitive markets.\nHigh CDI · Low BDI   ATTACK — the growth\n  market. ESOV and reach.\nLow CDI · High BDI   NICHE strength —\n  harvest. Retention messaging; distribution\n  and pack economics matter more than media\n  weight. Do not overspend.\nLow CDI · Low BDI    SKIP. Test-and-learn\n  budgets only, with a defined exit rule.</div>Why Maharashtra beats Kerala for the incremental rupee: <b>12% of category sales but only 8% of brand sales</b>. Closing that gap is worth more absolute volume than anything available in a smaller stronghold — which is the deck’s stated conclusion.'},

{t:'mkt',tag:'apply',diff:'hard',trap:true,
 given:['UP: 17% population, 13% category, 7% brand'],
 q:'Uttar Pradesh has 17% of the population but CDI 76 and BDI 41. What does the deck conclude?',
 opts:['Demand has to be built before brand share can grow — media alone will not do it',
       'It is by far the largest opportunity, since it holds more people than anywhere else',
       'It is a stronghold to defend at efficient media weight',
       'It should be weighted by population in the national plan'],
 why:'<b>Size is not demand.</b> UP holds 17% of the population and only 13% of category sales — the category itself is under-developed there. A national plan weighted by population <b>over-invests in UP every single year</b>, which is precisely the mistake the deck is warning against.<br><br>Low CDI means <b>demand has to be built before brand share can be built, and media alone will not do it</b> — it is a long game, judged on category penetration movement rather than brand share.<br><br>The five pitfalls to quote whenever CDI/BDI appears:<div class="work">1 Do not ignore absolute market SIZE — a\n  BDI of 300 in a tiny market is little revenue\n2 Use the right POPULATION BASE — the\n  target audience, not the total population\n3 Do not confuse DISTRIBUTION with demand\n  — low BDI may be an availability problem\n4 Look beyond: a high-CDI, low-BDI market\n  may be dominated by strong regional brands\n5 Never use CDI/BDI in ISOLATION</div>'},

{t:'mkt',tag:'concept',diff:'medium',
 q:'What does the <b>BDI ÷ CDI</b> ratio tell a planner?',
 opts:['Below 1.0 the brand is converting less demand than exists — an opportunity',
       'Below 1.0 the brand is outperforming the category — defend it',
       'Above 1.2 the market should be exited entirely',
       'It measures how efficiently media inventory can be bought in that particular market'],
 why:'<div class="work">BDI ÷ CDI < 1.0   the brand converts LESS\n  demand than exists → opportunity\nBDI ÷ CDI ≈ 1.0   brand performance matches\n  category potential → maintain and optimise\nBDI ÷ CDI > 1.2   the brand OUTPERFORMS its\n  category → a stronghold to defend</div>Its practical virtue, in the deck’s words: <b>it sorts a long market list in one column.</b><br><br>Three rules before you calculate anything:<div class="work">1 SAME BASE for both indices — identical\n  population base for CDI and BDI\n2 100 IS THE NORM by construction — never\n  re-centre the axes on your own sample average\n3 SHARES, NOT ABSOLUTES — every input is a\n  percentage of the national total, and each\n  column should sum to 100%</div>'},

{t:'mkt',tag:'concept',diff:'medium',
 q:'A market scores <b>82 on the Retail Media Index</b>. What does the deck recommend?',
 opts:['Retail media led — concentrate spend behind retail media as the primary channel',
       'Omnichannel mix — balance retail media with broader channel investment everywhere',
       'Traditional media focus — prioritise reach-building channels',
       'Pilot only — run a small test with a defined exit rule'],
 why:'The RMI thresholds:<div class="work">80 and above  RETAIL MEDIA LED\n60 – 79       RETAIL MEDIA FIRST, supported\n              by complementary channels\n40 – 59       OMNICHANNEL MIX\nBelow 40      TRADITIONAL MEDIA FOCUS</div>RMI measures a market’s <b>e-commerce adoption, organised-retail depth and the advertising inventory available on those platforms</b> — built from five inputs, each rescaled 0–100 and weighted: <b>e-commerce penetration, retail media ecosystem maturity, category search demand, digital payment adoption and conversion potential</b>.<br><br>Why it belongs in the prioritisation model: commerce advertising is forecast to grow around <b>29% in 2026</b>, it <b>converts closest to purchase</b> (so a high-RMI market can carry lower upper-funnel weight for the same sales outcome), and it supplies <b>market-level measurement</b> — share of search, share of category page, ROAS.'},

{t:'mkt',core:0,tag:'apply',diff:'hard',trap:true,
 q:'A Tier-2 city has strong Amazon adoption but very few dark stores. How should it be planned?',
 opts:['High on retail media, low on quick commerce — plan sponsored commerce, not impulse',
       'High on both indices — lead with impulse and occasion campaigns',
       'Low on both indices — cover it through national spill only',
       'High on quick commerce, low on retail media — use weather-triggered creative and dayparting'],
 why:'Two indices that sound alike and decide different things:<div class="work">RETAIL MEDIA INDEX\n  “Can I advertise effectively where people\n   shop?” Amazon, Flipkart, JioMart, BigBasket.\n  Gains most: CONSIDERED purchases —\n  electronics, appliances, beauty, apparel.\n  Fails when the e-commerce base is thin.\nQUICK COMMERCE INDEX\n  “Can a consumer act on the ad within\n   minutes?” Blinkit, Zepto, Instamart.\n  Gains most: IMPULSE purchases —\n  beverages, snacks, ice cream, personal care.\n  Fails when DARK-STORE DENSITY is low,\n  making the delivery promise — and therefore\n  the creative — untrue.</div>Strong marketplace adoption without dark stores is exactly the deck’s worked example. <b>Metro Bengaluru is high on both; this city is high on one and low on the other, and should be planned accordingly.</b><br><br>On the combined matrix, the <b>bottom-right — high opportunity, low readiness — is the most misread quadrant</b>: it looks like a retail-media market on a spreadsheet, but awareness and distribution have to come first.'},

/* ============ SECTION 06 · MEDIA MIX & FRAMEWORK ============ */

{t:'mix',tag:'concept',diff:'easy',
 q:'The deck defines a media mix as answering which question?',
 opts:['Not which medium is best, but what combination works best',
       'Which single medium delivers the lowest cost per thousand',
       'How many channels a budget of this size can support',
       'Which medium the target audience says it prefers'],
 why:'<b>A media mix is the combination of channels a brand uses to reach its target audience and achieve its objectives — not which medium is the best, but what combination works best.</b><br><br>Four reasons one medium cannot do everything:<div class="work">AUDIENCE FRAGMENTATION — no single\n  channel reaches everyone\nDIMINISHING RETURNS — more budget into\n  one channel yields shrinking incremental\n  impact past saturation\nMULTIPLE TOUCHPOINTS — discovery,\n  research, comparison and conversion need\n  different channels\nDIFFERENT MEDIA STRENGTHS — TV builds\n  reach and salience, search captures intent,\n  social drives engagement</div>And what the mix solves for: <b>incremental reach, funnel progression, channel efficacy, and integration instead of channel silos.</b> Cross-media exposure increases message recall by <b>25–40%</b>.'},

{t:'mix',tag:'apply',diff:'medium',
 given:['₹50L on YouTube → 60% reach','+₹10L same channel → 63%','+₹10L on Instagram → 70%'],
 q:'Spending ₹10 lakh more on the same channel lifts reach 60%→63%; the same money on a second channel lifts it 60%→70%. Why?',
 opts:['Extra spend in one channel mostly repeats on people already reached',
       'Instagram simply has a larger total audience than YouTube',
       'The second channel is always cheaper per impression',
       'Reach curves are linear, so any new spend adds exactly the same reach'],
 why:'The reach curve flattens because <b>as spending increases, more impressions go to people already reached</b>. Eventually extra spending in that channel delivers very little new reach — it buys <b>frequency</b>, not <b>reach</b>.<div class="work">ADD MORE TO CHANNEL ONE\n  mostly reaches the same users again\n  increases frequency\n  smaller additional return\nADD ANOTHER CHANNEL\n  reaches people channel 1 missed\n  adds INCREMENTAL reach\n  higher return from the next rupee</div>Hence the five-step logic for arriving at a mix: <b>start with the highest-reach channel → invest while it adds reach efficiently → watch for rising duplication and declining incremental reach → add another channel to reach new consumers → rebalance as costs, audiences and performance change.</b><br><br>Note this is not an argument that more channels are always better — it is an argument about <i>where the next rupee works hardest</i>.'},

{t:'mix',tag:'calc',diff:'hard',
 given:['TV: R100 A65 TS70','Digital: R75 A90 TS85','CRM: R25 A100 TS95'],
 q:'Applying awareness weights of <b>Reach 50%, Affinity 30%, Time Spent 20%</b>, which channel wins?',
 opts:['TV, at 83.5',
       'Digital, at 84.0',
       'CRM / Owned, at 90.3',
       'All three tie at roughly 80'],
 why:'<div class="work">TV      = (100×.5)+(65×.3)+(70×.2) = 83.5\nDigital = (75×.5) +(90×.3)+(85×.2) = 81.5\nCRM     = (25×.5)+(100×.3)+(95×.2) = 61.5\n→ TV WINS, because SCALE carries the\n  greatest weight</div>Change the weights to <b>consideration (30–40–30)</b> and the same scores produce a different winner: TV 77.0, <b>Digital 84.0</b>, CRM 76.0 — digital leads as affinity becomes more important.<br><br>Add a fourth criterion for conversion — <b>Reach 10, Affinity 25, Time Spent 15, Conversion Potential 50</b> — and <b>CRM/Email wins at 90.3</b>.<br><br>The lesson the deck wants: <b>same channels, different weights, different winner.</b> The scorecard does not tell you the answer; the objective sets the weights, and the weights produce the answer. Scores also suggest the <b>starting budget split</b> (channel score ÷ total scores), which must then be checked for delivery, minimum investment, incremental reach and feasibility.'},

{t:'mix',core:0,tag:'concept',diff:'medium',
 q:'The three lenses used to compare channels in the scorecard are:',
 opts:['Reach, Affinity and Time Spent',
       'Reach, Frequency and Cost',
       'Impressions, Engagement and Conversion',
       'Cost per mille, Viewability and Attention'],
 why:'<div class="work">R  REACH       how many? The proportion\n   of the TG the channel can potentially\n   reach → shows potential SCALE\nA  AFFINITY    how well does it fit? How\n   strongly the TG uses it versus the general\n   population → shows audience FIT\nTS TIME SPENT  how much opportunity?\n   Relative time the TG spends with the\n   channel → shows DEPTH of opportunity</div>Each criterion is normalised separately: <b>score = channel’s raw value ÷ highest raw value for that criterion × 100</b>, so the strongest channel on <i>that</i> input becomes 100.<br><br>The instruction that trips people up in the practice sheet: <b>find the highest value separately for Reach, Affinity and Time Spent — do not use one common maximum across all three columns.</b>'},

{t:'mix',tag:'concept',diff:'medium',trap:true,
 q:'Media Mix Modelling is <b>not</b> the right tool for which of these?',
 opts:['Deciding in real time which creative to run tomorrow',
       'Annual budget planning across channels',
       'Comparing the long-run ROI of TV versus social',
       'Separating baseline sales from media-driven incremental uplift'],
 why:'<b>MMM answers one question: which channels actually drove our sales — and by how much?</b> It takes 2+ years of weekly sales, spend by channel, plus price, seasonality and competitor activity, and uses regression to isolate each channel’s contribution — accounting for <b>carryover</b> (effects linger after spend stops) and <b>diminishing returns</b>.<div class="work">MMM IS FOR\n  annual budget planning · long-run channel\n  ROI comparison · baseline vs media-driven\n  uplift · scenario planning (“cut TV 20%?”)\nMMM IS NOT FOR\n  real-time decisions — results take months\n  optimising WITHIN a channel (which creative?)\n  small brands with limited history\n  crediting individual digital touchpoints\n  isolating a single campaign</div>Best practice is a trio: <b>MMM for annual budget and channel weight, attribution (MTA) for in-campaign digital optimisation, and pilot tests for proving true incrementality.</b>'},

{t:'mix',core:0,tag:'concept',diff:'medium',
 q:'In the integrated framework, what makes a channel list into a media mix?',
 opts:['Every channel carries a distinct role across the audience journey',
       'Every channel receives an equal share of the total working budget',
       'Every channel is measured against the same single KPI',
       'Every channel runs for the same number of weeks'],
 why:'<b>“The media mix is not a list of channels — it is a set of complementary roles across the audience journey.”</b><div class="work">VIDEO    create broad awareness and\n  emotional salience          → AWARENESS\nCREATORS demonstrate the product and\n  build trust                 → CONSIDERATION\nSEARCH   capture active intent at the\n  moment of need              → CONVERSION\nOOH      build visibility and proximity\n                              → AWARENESS\nCRM      nurture, convert and retain\n                              → RETENTION</div>Sequenced, that becomes <b>Create → Demonstrate → Capture → Convert</b>: “I know this brand” → “I believe this could work” → “I am considering it” → “I am ready to act.” The test the framework poses: <b>can the audience move logically from one channel role to the next?</b><br><br>And the one-page gate before building any plan: is the <b>problem</b> clear, the <b>audience</b> actionable, does each <b>funnel</b> stage have a job, does every <b>channel</b> have a role, are <b>investment</b> choices justified, and can you <b>measure</b> and optimise? <b>A plan can be detailed and still be strategically wrong if these are unanswered.</b>'},

/* ============ SECTION 07 · BRIEF & BUDGETING ============ */

{t:'brief',tag:'concept',diff:'easy',
 q:'What separates a <b>media brief</b> from a <b>creative brief</b>?',
 opts:['The media brief guides delivery; the creative brief guides the message',
       'The media brief guides the message; the creative brief guides delivery',
       'The media brief is written by the agency; the creative brief by the client',
       'The media brief covers digital only; the creative brief covers all media'],
 why:'<div class="work">CREATIVE BRIEF guides the MESSAGE —\n  what we say, the idea, tone, look and feel\nMEDIA BRIEF    guides the DELIVERY —\n  who sees it, where, when, how often,\n  and at what cost</div>They share objectives and audience but answer different questions, and <b>strong campaigns need both</b>.<br><br>A media brief is <b>a structured document from a brand to its media agency defining what a campaign must achieve, who it must reach, and within what budget, timing and constraints</b>. The brief states the problem; the agency responds with the strategy and plan.<br><br>The line worth quoting in an exam: <b>“Garbage in, garbage out — a weak brief almost guarantees a weak plan, at full cost.”</b> Most media plan revisions trace back to gaps in the original brief.'},

{t:'brief',tag:'concept',diff:'medium',
 q:'Which is <b>not</b> one of the eight building blocks of a media brief?',
 opts:['Creative concept and storyboard',
       'Background and context',
       'Geography and timing',
       'Constraints and mandatories list'],
 why:'The eight blocks:<div class="work">1 Background & context\n2 Marketing objectives\n3 Role of media\n4 Target audience\n5 Budget\n6 Geography & timing\n7 KPIs & measurement\n8 Constraints & mandatories</div>The creative concept belongs to the <b>creative brief</b> — the media brief deliberately stops at what media must deliver.<br><br>Block 8 is the one students skip and clients forget: legal and category regulation (<b>ASCI-compliant substantiation</b> for claims), brand-safety standards and blocklists, mandated or excluded channels, creative formats and languages with their lead times, and <b>existing commitments</b> such as dealer co-op agreements that must be honoured.<br><br>The VoltRide example runs all eight blocks end to end and is the model answer to “show me a worked brief”.'},

{t:'brief',tag:'apply',diff:'medium',trap:true,
 q:'A client brief says: “Target everyone 18–65 who might be interested, and run TV plus Instagram.” What are the two errors?',
 opts:['The audience excludes nobody, and the brief prescribes channels instead of the problem',
       'The audience has been defined too narrowly, and the budget has not been disclosed anywhere',
       'The timing is missing, and the KPIs are stated too precisely',
       'The brief is too long, and it names a single decision-maker'],
 why:'Two separate failures, both on the deck’s list.<br><br><b>The audience.</b> “A 47-year age band with no behavioural or need-based filter is really just everyone.” And <b>“might be interested” is not a targeting criterion — it describes hope, not a reachable, definable group.</b> Without a barrier, occasion or signal, every channel looks equally right, so the brief is impossible to plan against.<br><br><b>The channels.</b> Top of the DON’T list: <b>“Don’t prescribe channels — brief the problem, not the plan.”</b> A client who specifies TV and Instagram has pre-empted the one thing they are paying the agency to work out.<div class="work">DO   one clear measurable objective ·\n  share data and past learnings · state the\n  real budget and whether it can flex · name\n  one decision-maker · allow a live Q&A ·\n  state mandatories upfront\nDON’T vague goals (“go viral”) · prescribe\n  channels · hide the budget · brief by email\n  alone · cram in conflicting priorities ·\n  change the brief midstream</div>'},

{t:'brief',core:0,tag:'concept',diff:'medium',
 q:'The five brief families split into <b>planned</b> and <b>triggered</b>. Which pair is triggered?',
 opts:['Disruption and always-on',
       'Annual and half-year',
       'Campaign and annual',
       'Half-year and campaign briefs'],
 why:'<div class="work">PLANNED — driven by the calendar\n  ANNUAL     fiscal year start · 12 months ·\n    CMO/brand team · “what should this\n    brand achieve this year?”\n  HALF-YEAR  calendar checkpoint · 3–6 months\n    · “are we on track, what needs to shift?”\n  CAMPAIGN   a business need · 2–12 weeks ·\n    brand manager · “how do we deliver\n    this one objective?”\nTRIGGERED — driven by an event\n  DISRUPTION a market event · days to weeks ·\n    brand + agency, urgent · “what must\n    change right now, and what shouldn’t?”\n  ALWAYS-ON  continuous data · no fixed end ·\n    performance team · “what is the data\n    telling us to adjust today?”</div>The hierarchy: the <b>annual brief sets the guardrails</b>, half-year corrects, campaigns execute. <b>Disruption briefs can override any layer; always-on briefs run alongside all three.</b><br><br>And the single test for every brief: <b>does it trace back to the annual objective?</b> If not, that is a scope problem, not a new strategy.'},

{t:'brief',tag:'concept',diff:'medium',
 q:'Which budgeting method is described as the <b>gold standard</b>, and why?',
 opts:['Objective & Task — it costs the specific tasks needed to hit a defined goal',
       'Percentage of Sales — it scales automatically with revenue',
       'Competitive Parity — it protects share of voice against rivals',
       'Affordable — it guarantees that the budget will always be approved by finance'],
 why:'<b>Objective &amp; Task</b> works in three steps: <b>set a specific measurable objective</b> (reach 60% of TG 5× in 4 weeks) → <b>define the tasks</b> (channels, formats, placements, frequency) → <b>cost the tasks</b> at market rates. The sum is a justified budget.<div class="work">PROS goal-driven · defensible · best\n  practice · links spend to outcomes\nCONS requires rich data · time-intensive ·\n  needs media expertise</div>The other three, with their fatal flaws:<div class="work">% OF SALES (5–15%) simple and finance-\n  friendly, but BACKWARD-LOOKING and it\n  CUTS SPEND WHEN YOU ARE STRUGGLING\n  MOST. Breaks down entirely for launches,\n  category creators, startups and B2B.\nCOMPETITIVE PARITY maintains SOV, but\n  ASSUMES RIVALS’ STRATEGY IS CORRECT\n  and can trigger escalation spirals.\nAFFORDABLE / TOP-DOWN financially safe\n  and fast, but NOT MARKET-DRIVEN and has\n  no link to objectives or SOV.</div>'},

{t:'brief',tag:'calc',diff:'hard',
 given:['TV 2,000 GRPs × ₹55,000 CPRP','Digital 700M impressions × ₹100 CPM'],
 q:'Build the Objective &amp; Task baseline for Stride’s FY budget.',
 opts:['₹18 crore — ₹11 cr TV plus ₹7 cr digital',
       '₹11 crore — TV only, since digital is supplementary',
       '₹25 crore — ₹11 cr TV plus ₹14 cr digital',
       '₹7.7 crore — TV at ₹1.1 cr plus digital at ₹6.6 cr'],
 why:'<div class="work">TV       2,000 GRPs × ₹55,000 CPRP\n         = ₹11 crore\nDIGITAL  700,000,000 impressions\n         ÷ 1,000 × ₹100 CPM\n         = ₹7 crore\n                        ─────────\nO&T BASELINE            = ₹18 crore</div>Note the two different cost bases: <b>GRPs are costed on CPRP, impressions on CPM</b> — and in the FinTech example, <b>acquisition-led digital is costed on CAC instead</b> (4,000,000 users × ₹75 = ₹30 cr) while TV remains on GRPs because it drives awareness, not direct sign-ups.<br><br>Then the sanity check: category spend ₹120 cr × Stride’s 18% SOM = <b>₹21.6 cr required for parity</b> — ₹3.6 cr above the O&amp;T baseline, because the market is spending more than the task-costed number assumed.'},

{t:'brief',tag:'apply',diff:'medium',
 q:'In practice, how do brands combine the methods?',
 opts:['O&T builds the baseline, parity sanity-checks it, the affordable ceiling settles it',
       'The affordable ceiling is set first, and no other method is applied',
       'Parity sets the number, and O&T is then used only for post-campaign reporting to finance',
       'Percentage of sales sets the number, and the others are ignored'],
 why:'<b>Brands always use a blend — no single method captures the full picture.</b><div class="work">STEP 1 BUILD THE BASELINE — Objective\n  & Task. Map the reach, frequency and\n  channels needed.\nSTEP 2 SANITY CHECK — Competitive Parity.\n  Compare against category SOV benchmarks;\n  adjust, or accept the SOV risk KNOWINGLY.\nSTEP 3 FINANCE ALIGNMENT — Affordable\n  Ceiling. Present within Finance’s ceiling,\n  using the O&T workings as negotiating\n  evidence.</div>Stride’s outcome is the point: O&amp;T said ₹18 cr, parity said ₹21.6 cr, Finance opened at ₹15 cr — and the evidence negotiated the approved ceiling up to <b>₹20 crore</b>. The remaining ₹1.6 cr gap to full parity is <b>accepted as a documented, knowing risk rather than an oversight</b>.<br><br>The FinTech case shows the other outcome: O&amp;T and parity both landed at ₹45 cr while the Series C pool allowed ₹50 cr — <b>convergence means high confidence, and the spare ₹5 cr is banked as contingency, not spent just because it is available.</b>'},

{t:'brief',tag:'concept',diff:'medium',
 q:'What is the deck’s indicative funnel split of a total media budget?',
 opts:['Awareness 40–60%, consideration 25–35%, conversion 20–30%',
       'Awareness 20–30%, consideration 25–35%, conversion 40–60%',
       'Awareness 60–75%, consideration 15–25%, conversion 10–20%',
       'An equal one-third split across all three stages'],
 why:'<b>Step 1 decides the total</b> (% of sales, parity, O&amp;T or affordable). <b>Step 2 splits it across the funnel</b>:<div class="work">TOP (awareness)        40–60%\nMID (consideration)    25–35%\nBOTTOM (conversion)    20–30%</div>Six factors move the split: <b>brand maturity</b> (Meesho launch 60% TOF vs mature Amazon India 35%), <b>category purchase cycle</b> (HDFC Life heavy mid-funnel over six months vs Swiggy bottom-heavy for instant orders), <b>campaign objective</b> (brand relaunch 70% TOF vs Big Billion Days 60% BOF), <b>competitive intensity</b>, <b>data and attribution maturity</b>, and <b>channel structural role</b>.<br><br>The last one is a useful trap-detector: <b>TV and OOH are structurally top-funnel and search and retargeting structurally bottom-funnel. Forcing TV into a direct conversion role wastes its reach value.</b>'},

{t:'brief',tag:'apply',diff:'hard',trap:true,
 q:'A brand cuts top-funnel spend each quarter because ROAS is highest on retargeting. A year later CPA is rising. What is the diagnosis?',
 opts:['Over-indexing on the bottom funnel has shrunk the pool of aware prospects',
       'Retargeting creative has worn out and needs refreshing',
       'The attribution window has been set too short to credit later conversions',
       'Competitors have outbid the brand on branded search terms'],
 why:'The first of the four funnel-split watch-outs: <b>“Brands obsessed with ROAS cut TOF, shrinking the funnel over time. Short-term efficiency; long-term brand erosion.”</b> The fix: <b>maintain a minimum TOF investment (40–50%) even in performance-heavy campaigns.</b><br><br>Bottom-funnel media <b>is entirely dependent on what flows in from TOF and MOF</b> — it works hardest when it captures intent created earlier. <b>Over-investing there means paying for every sale rather than earning organic preference</b>, and the deck’s diagnostic line is explicit: <b>if CPA keeps rising, the fix is usually in the upper funnel, not in BOF bid optimisation.</b><br><br>The other three watch-outs: <b>skipping the mid funnel</b> (TV ads and retargeting with nothing in between creates a leaky funnel — the most commonly skipped stage, because MOF ROI is slower and messier to prove), <b>one split for all campaigns</b>, and <b>measuring every stage with one KPI</b>.'},

/* ============ SECTION 08 · CHANNEL PLANNING ============ */

{t:'chan',tag:'apply',diff:'medium',trap:true,
 given:['60% reached','Average frequency 4'],
 q:'A campaign reached 60% of the audience at an average frequency of 4. How many of those people definitely got four exposures?',
 opts:['We cannot tell — the average hides the distribution',
       'All of them, by definition of the average',
       '60% of them received exactly four',
       'None — an average frequency is always a rounding artefact'],
 why:'<b>Average frequency can conceal both underexposure and overexposure.</b> The same average of 4 can contain people who saw it once, people right at the threshold, and people hammered ten times.<div class="work">Illustrative distribution, 60% reached:\n  not reached 40%\n  1×  5%     2× 10%\n  3× 10%     4× 15%     5+ 20%\n\nEffective reach at 3+ = 45%\n  (only 3×, 4× and 5+ count)</div>Which is why the instruction is: <b>plan and evaluate the exposure distribution and effective reach — not average frequency alone.</b><br><br>This is the same trap as the GRP question: a single summary number that two very different campaigns can share.'},

{t:'chan',tag:'concept',diff:'medium',
 q:'Effective frequency is often quoted as <b>3+</b>. What is the deck’s position on that?',
 opts:['It is a starting point shaped by conditions, not a universal rule',
       'It is a fixed law of advertising established by Krugman',
       'It applies only to television, never to digital channels',
       'It should be raised to 5+ for every category and brand without exception'],
 why:'<b>“Do not begin with 3+. Begin with the communication task and the conditions around it.”</b> Krugman’s idea explains how repeated exposure moves from <b>recognition → meaning → reinforcement</b>, but the number itself is a judgement.<div class="work">LOWER frequency may be enough when\n  the brand is familiar · the message is\n  simple · attention is high · the decision\n  is low-risk\nHIGHER frequency may be needed when\n  the brand or category is new · the message\n  needs explanation · clutter is high ·\n  attention is fragmented</div>Six questions shape the recommendation: <b>objective, brand familiarity, message complexity, competitive clutter, purchase cycle and audience attention.</b> The answer is <b>a judgement built from evidence, not a number copied from a textbook</b>.'},

{t:'chan',core:0,tag:'apply',diff:'hard',
 given:['Unfamiliar brand +2','Complex message +3','High clutter +2','Long cycle +1','Fragmented attention +1'],
 q:'Using Ostrow’s method, those scores total +9. What frequency threshold does the deck’s conversion table give?',
 opts:['5+',
       '3+',
       '4+',
       '6+'],
 why:'Ostrow scores each factor from <b>−3 to +3</b> across three groups — <b>marketing</b> (brand familiarity, competitive pressure, purchase cycle), <b>message</b> (complexity, campaign newness, distinctiveness/wear-out) and <b>media</b> (attention/involvement, clutter, continuity opportunities) — then converts the total.<div class="work">≤ −3        2+\n−2 to +2    3+\n+3 to +6    4+\n+7 to +10   5+     ← total of +9\n> +10       6+</div>The contrast the deck draws: a <b>familiar breakfast brand</b> scoring −3 overall lands on <b>2+</b>, while a <b>new personal-finance app</b> scoring +9 lands on <b>5+</b>. Same method, opposite answers, because the conditions are opposite.<br><br>Its own honest caveat: <b>this −3 to +3 matrix is a teaching adaptation — use it consistently, then validate with campaign evidence.</b>'},

{t:'chan',tag:'concept',diff:'medium',
 q:'<b>Recency theory</b>, associated with Erwin Ephron, argues that:',
 opts:['Lighter continuous presence beats heavy bursts followed by silence',
       'The final exposure before purchase deserves all the credit',
       'Frequency should always be capped at three per week',
       'Advertising works only within 24 hours of an actual purchase decision'],
 why:'Because <b>we cannot predict exactly when each person will be ready to buy</b>, recency planning favours <b>regular opportunities to see the brand</b> — sometimes called the <b>“shelf-space” approach</b>.<div class="work">Five buying moments, same budget:\n  FLIGHTING   catches 2 of 5 moments\n  CONTINUITY  covers all 5</div><b>Recency prioritises being present when demand appears — not building the highest possible cumulative frequency.</b><br><br>Effective frequency and recency answer different questions and are not rivals:<div class="work">EFFECTIVE FREQUENCY — HOW MANY?\n  useful when the brand is new or the\n  message is complex; focuses on a threshold\nRECENCY — HOW RECENT?\n  useful when purchase timing is unpredictable\n  and in frequently purchased categories;\n  focuses on opportunity coverage</div>The practical blend: <b>maintain a recency-oriented baseline, then add weight when the message needs learning, launch impact or reinforcement.</b>'},

{t:'chan',core:0,tag:'concept',diff:'medium',trap:true,
 q:'A complete <b>frequency cap</b> needs three parts. Which set is right?',
 opts:['Number of exposures, per person, per time period',
       'Number of exposures, per channel, per creative',
       'Budget limit, audience size, campaign duration',
       'Impressions, reach target, effective frequency threshold'],
 why:'<b>5 exposures + per person + per week</b> — a number, an audience unit and a time period. Miss any one and the cap is meaningless.<div class="work">DESIRED FREQUENCY the level the plan\n  AIMS to deliver\nFREQUENCY CAP     the CEILING preventing\n  excessive delivery\nACTUAL FREQUENCY  what the platform\n  ultimately DELIVERS and reports</div>Two cautions that matter in practice: <b>a cap is not a guarantee of delivery</b>, and it is <b>often applied within one platform or campaign — exposures across YouTube, Meta, programmatic and other environments can still add up.</b><br><br>The one-line relationship: <b>effective frequency sets the ambition; frequency capping limits over-delivery.</b>'},

{t:'chan',tag:'apply',diff:'medium',
 q:'Match the schedule to the category: air conditioners and tax-filing platforms typically use…',
 opts:['Flighting — bursts separated by planned dark periods',
       'Continuity — steady presence at a consistent level',
       'Pulsing — a baseline with heavier bursts layered on',
       'Recency triggers — weight following live demand signals'],
 why:'<div class="work">CONTINUITY  steady presence throughout.\n  Protects recency; best when demand exists\n  all year and purchase timing is unpredictable.\n  Toothpaste, detergents, telecom, banking\n  apps, e-commerce/search.\n  Watch-out: a limited budget spread too\n  thinly creates presence without impact.\nFLIGHTING   bursts with planned DARK\n  periods. Best when demand is seasonal or\n  event-led, or the budget cannot sustain\n  year-round presence. AIR CONDITIONERS,\n  TAX-FILING PLATFORMS, festive gifting,\n  film/OTT premieres.\n  Watch-out: missed purchase opportunities\n  and memory decay during dark periods.\nPULSING     baseline plus bursts. Demand all\n  year with predictable peaks. E-commerce\n  marketplaces, automobiles, paints,\n  beverages. Often the practical compromise.</div>And the point the deck closes on: <b>one brand can run different schedules across the funnel</b> — continuity for awareness, pulsing for consideration, recency triggers for conversion, timed pulses for retention. <b>The schedule is a portfolio of audience tasks, not one pattern imposed on everything.</b>'},

{t:'chan',tag:'calc',diff:'medium',
 given:['Budget ₹89,88,000','Blended CPRP ₹6,420'],
 q:'How many GRPs can that TV budget buy, and what does the number become?',
 opts:['1,400 GRPs — the ceiling for every step that follows',
       '1,400 GRPs — the reach percentage the plan will deliver',
       '577 GRPs — the weekly allocation across the flight',
       '6,420 GRPs — the total impressions in thousands'],
 why:'<b>Total GRPs affordable = Budget ÷ Blended CPRP</b> = 89,88,000 ÷ 6,420 = <b>1,400 GRPs</b>.<br><br>The second option is the conceptual trap: <b>1,400 GRPs is weight, not reach</b>. The same plan might deliver only <b>73% reach 1+</b> — the remaining weight is repeat exposure on people already counted, which works out to roughly <b>19 average OTS</b> across the flight.<br><br>The eight-step TV planning process, for orientation:<div class="work">1 objective & target audience\n2 reach & frequency goals\n3 prioritise markets (BDI/CDI)\n4 select channels & build the mix\n5 allocate budget & negotiate CPRP\n6 choose the scheduling pattern\n7 allocate GRPs across weeks\n8 evaluate reach, frequency & optimise</div>Step 8 matters: if projected reach falls short, <b>revisit channel mix, flowchart pattern or budget — do not just add GRPs blindly.</b>'},

{t:'chan',tag:'calc',diff:'hard',
 given:['Plan A: 8×10s + 4×20s + 2×30s','Plan B: 14×10s'],
 q:'Two plans each have 14 spots. What is Plan A’s <b>ACD</b>, and why does it matter?',
 opts:['17.1 seconds — identical GRPs can still buy very different airtime',
       '17.1 seconds — it tells you how many people each individual spot reached',
       '10.0 seconds — all CPRP is quoted on a ten-second base anyway',
       '24.0 seconds — longer spots always cost exactly double'],
 why:'<b>ACD = total seconds bought ÷ total number of spots.</b><div class="work">Plan A  (8×10)+(4×20)+(2×30) = 240 sec\n        240 ÷ 14 = 17.1 seconds\nPlan B  14×10 = 140 sec\n        140 ÷ 14 = 10.0 seconds</div>Plan A carries <b>240 seconds of advertising time against Plan B’s 140</b>. Even at identical GRPs, Plan A delivers longer average exposure per spot — so <b>GRP counts across two plans are not truly comparable unless you know the spot-length mix behind them.</b><br><br>The pricing rule that follows: <b>CPRP is typically quoted on a 10-second base, and longer spots cost more but not linearly — a 20-second spot usually prices at roughly 1.5–1.7× the 10-second CPRP, not 2×.</b> Planners use ACD to sanity-check blended CPRP whenever a flight mixes a long launch film with a short cut-down.'},

{t:'chan',tag:'concept',diff:'medium',
 q:'What shifts a <b>reach curve</b> upward — letting the same GRPs deliver more reach?',
 opts:['Spreading weight across more channels and dayparts, over a longer flight',
       'Concentrating all of the weight on the single highest-rated channel available',
       'Buying only prime time, where viewership is highest',
       'Shortening the flight so all exposures land in one week'],
 why:'A reach curve plots <b>cumulative reach against cumulative GRPs</b>: steep at first, then flattening as spots increasingly land on people already reached. In the deck’s illustrative curve, it <b>climbs fast to ~800 GRPs, then each additional 200 GRPs beyond 1,200 adds only 1–2 percentage points</b>.<div class="work">WHAT SHIFTS IT\n  CHANNEL MIX   more channels reach new,\n    non-overlapping viewers → curve up\n  DAYPART MIX   blending prime with day and\n    fringe captures different viewing occasions\n  FLIGHT LENGTH same GRPs over more weeks\n    generally builds higher reach\n  FRAGMENTATION more fragmented viewing\n    means MORE GRPs needed for the same reach</div>Which is why <b>100% prime time maximises impact but burns budget fastest and caps how many GRPs a fixed budget can buy</b>. Most plans lead with <b>one or two high-share anchor channels and add supporting channels to extend reach efficiently</b>.<br><br>Curves are <b>modelled from actual duplication patterns for that specific channel mix and TG — they are not universal.</b>'},

{t:'chan',tag:'apply',diff:'medium',
 q:'A regional FMCG brand launches in four districts of one state. Which print buy fits?',
 opts:['A zonal or city buy covering only the relevant editions',
       'A national buy across all available editions at a blended rate',
       'A jacket wraparound on every metro edition nationally',
       'A classified insertion in the national business daily'],
 why:'<b>Editions are a targeting decision.</b> Most large Indian dailies print multiple city and state editions, each with its own local news and pricing — <b>treat editions like outlet selection, and match them to where the TG actually is</b>. A regional launch may need only four or five key editions, not all of them.<div class="work">NATIONAL BUY  all/most editions at a blended\n  rate → pan-India launches, awareness\nZONAL/REGIONAL a cluster within one zone,\n  e.g. Chennai + Bengaluru + Hyderabad →\n  regionally skewed demand\nCITY BUY      a single edition on its own\n  merits → retail brands, store openings,\n  local launches, notices</div>Pricing scales with edition circulation and readership — <b>Delhi and Mumbai editions almost always carry the steepest premiums</b>, whichever route you take.<br><br>Also in the print planner’s toolkit: formats from <b>full page, half, quarter, jacket/wraparound, DPS, skybus and pointer/solus</b>; <b>supplements</b> that reach self-selected high-intent niches at lower effective CPMs; and <b>advertorials</b>, priced at a premium and required to be labelled as advertising.'},

{t:'chan',tag:'concept',diff:'medium',trap:true,
 q:'Which statement about <b>OOH buying</b> is correct?',
 opts:['DOOH is priced per slot per day, unlike static sites rented monthly',
       'Static hoardings are sold in ten-second slots within an eight-hour rotation',
       'Bus wraps are normally sold for a minimum of one week',
       'Illumination is included in the base rental at no extra loading'],
 why:'<div class="work">Hoarding/unipole  monthly site RENTAL\nBus wrap          ~3-month minimum\nAuto-rickshaw     sold by FLEET\nDOOH screen       10-second slot in an\n  8-hour rotation — priced PER SLOT PER DAY,\n  not per month\nAirport backlit   gate-facing and\n  international-terminal panels carry the\n  highest premiums</div>The rate card has six components: <b>base rental</b> (location, traffic, size), <b>illumination loading</b> (typically <b>+20–40%</b> over an unlit panel), <b>position/visibility premium</b> (+50% to several times base), <b>production and mounting</b> (a separate one-time cost), <b>tenure and renewal</b>, and <b>permits and municipal fees</b>.<br><br>Site selection runs on <b>traffic and dwell time</b> — a traffic signal beats a fast-moving flyover — plus approach and sightline, audience-context fit, city tier, landmark value, and <b>circuit versus solus</b>: a connected circuit along one commute builds frequency, a single solus site buys dominance at one spot.'},

{t:'chan',core:0,tag:'apply',diff:'medium',
 q:'A brand wants OOH creative that actually registers. What does the deck advise?',
 opts:['Seven words or fewer, readable in under three seconds',
       'Detailed copy explaining the product’s full benefit range',
       'The same static creative across every daypart and city',
       'Maximum brand assets, with the logo repeated several times'],
 why:'<b>Legibility over cleverness: seven words or fewer, and a headline readable in under three seconds from a moving vehicle.</b> Limited exposure time is OOH’s defining constraint — the format rewards a single idea.<br><br>The rest of the creative checklist:<div class="work">DAYPARTING   static runs 24/7; digital screens\n  can shift by morning commute or weekend\nLANDMARK-LED the best OOH references the\n  site itself — a junction, skyline or local\n  landmark, not just the brand\nINTEGRATION  a hoarding’s job is often to\n  prime a search or a scroll — pair it with a\n  QR code, hashtag or retargeting pixel\nWEATHERPROOFING & PERMITS  flex must\n  survive monsoon and sun for the full tenure;\n  municipal certificates are the advertiser’s\n  liability too\nPRODUCTION LEAD TIME  book the creative,\n  not just the site</div>The numbers that justify OOH in a launch: <b>30–40% brand recall lift when OOH runs alongside TV or digital</b>, attention-adjusted CPM <b>3–8× cheaper than social</b>, and a minimum of <b>6–8 weeks of continuous exposure</b> to build meaningful recall.'},

{t:'chan',core:0,tag:'concept',diff:'medium',
 q:'In radio, what do <b>RODP</b> and <b>ROD</b> mean, and what is the buying principle?',
 opts:['Run of daypart and run of day — buy the occasion that fits the objective',
       'Rate of daily play and rate of delivery — buy the cheapest available slot',
       'Reach of daypart and reach of day — buy the highest-reach station only',
       'Radio on-demand playback and radio on demand — buy streaming first'],
 why:'<b>RODP = run of daypart. ROD = run of day.</b> And the rule: <b>buy the audience occasion that fits the objective, not automatically the most expensive slot.</b><div class="work">MORNING    commute, school runs, news —\n  reach and daily reminders\nMIDDAY/AFT workplace, retail, home —\n  efficiency and continuity\nEVENING DRIVE return commute, family\n  listening — higher demand and rates</div>Radio’s strengths are <b>mass local reach, frequency at scale, and immediacy</b> — traffic, weather, festivals and local events create timely opportunities. It is strongest when the brief needs <b>local salience, repetition, a human voice or a response trigger</b>.<br><br>Inventory splits into <b>spots</b>, <b>RJ / live integrations</b> (stronger involvement, less standardised delivery), <b>sponsorships</b>, and <b>digital audio</b> — and the buying rule is to <b>separate guaranteed spot delivery from value-added activity in the commercial proposal</b>.'},

{t:'chan',tag:'concept',diff:'easy',
 q:'What is cinema’s defining strength as a medium, and its matching limitation?',
 opts:['A captive, no-skip environment; but reach builds slowly',
       'The lowest cost per thousand; but creative must be short',
       'Real-time creative changes; but audiences skew older',
       'Guaranteed national reach; but no regional targeting'],
 why:'<b>Cinema sells attention, not just reach</b> — a dark room, a big screen and an audience that chose to be there for two-plus hours.<div class="work">STRENGTHS\n  No skip, no clutter — cannot fast-forward,\n    mute or switch away\n  Sensory impact — large screen, immersive sound\n  High attention and recall\n  Premium/affluent skew — multiplex audiences\n    are younger, urban, higher-income\n  Contextual targeting by genre, language and\n    certificate (U/UA/A)\n  Local flexibility — screen-level buying\nLIMITATIONS\n  Limited reach and frequency vs broadcast\n    or digital — scale builds SLOWLY\n  Long production and booking lead times\n  No real-time creative changes once the\n    DCP is in circuit\n  Reach is CONTENT-DEPENDENT — tied to the\n    film slate and footfalls</div>Best used for <b>launches needing high-impact short bursts, premium categories, festive and film-release tie-ins, and regional-language targeting via city or circuit buys</b>.'},

/* ============ SECTION 09 · COMPETITION & AI ============ */

{t:'ai',tag:'concept',diff:'medium',
 q:'HDFC Bank promoting personal loans competes with KreditBee and Paisabazaar for the same search keyword. In the deck’s framework these are:',
 opts:['Media competitors — competing for the same inventory',
       'Direct competitors — competing for the same purchase',
       'Audience competitors — competing for the same occasion',
       'Category competitors — competing for the same share of market'],
 why:'Three competitor sets, each answering different questions:<div class="work">DIRECT     compete for the same PURCHASE.\n  Same category, similar product and price\n  tier. Surf Excel vs Ariel, Tide, Henko.\n  → “Who is taking category demand?”\nAUDIENCE   compete for the same TIME or\n  OCCASION, sometimes outside the category.\n  Netflix vs Prime Video, YouTube, Reels,\n  gaming and television — evening\n  entertainment time.\n  → “Where is attention shifting?”\nMEDIA      compete for the same INVENTORY.\n  Any advertiser bidding on the same keyword,\n  placement or programme. HDFC vs SBI,\n  ICICI, Bajaj Finserv, KreditBee, Paisabazaar.\n  → “Who is increasing media costs?”</div>The rule that ties it together: <b>match the denominator to the decision.</b> Category SOV uses the direct set; share of attention uses the audience set; auction pressure uses the media set.'},

{t:'ai',tag:'apply',diff:'hard',trap:true,
 given:['Brand: 260 GRPs, 62% reach, freq 4.2, 8+ reach 9%','Competitor B: 296 GRPs, 58% reach, freq 5.1, 8+ reach 18%'],
 q:'Competitor B bought more GRPs but reached fewer people. What is the correct read?',
 opts:['Your plan is reach-led; Competitor B’s is frequency-led',
       'Competitor B’s plan is simply more efficient than yours',
       'The two datasets cannot be compared at all',
       'Competitor B has achieved a higher effective reach at every level'],
 why:'<b>More weight does not necessarily mean more people reached.</b> Competitor B delivers 296 GRPs against your 260, yet reaches 58% versus your 62% — and its <b>8+ reach is double yours</b> (18% vs 9%). Those extra GRPs went into repetition on a narrower group.<div class="work">Your plan          REACH-LED\nCompetitor B       FREQUENCY-LED</div>The deck adds two conditions before you may draw that conclusion at all: <b>use the same audience definition, markets and measurement method for both brands</b>, and <b>check the channel mix and creative duration too</b>.<br><br>Which is why the monitoring framework measures five layers, not one: <b>investment &amp; weight</b> (shows scale, not effectiveness), <b>deployment &amp; visibility</b> (reveals priorities), <b>audience delivery</b> (planned weight ≠ delivered audience), <b>message &amp; offer</b> (signals funnel role), and <b>market response</b> (where <b>association ≠ causation</b>).'},

{t:'ai',tag:'concept',diff:'medium',
 q:'A competitor runs a one-week spend spike. What does the monitoring loop say to do?',
 opts:['Wait for repeated evidence before changing strategy',
       'Match the spike immediately to protect share of voice',
       'Cut your own spend until their burst is over',
       'Reallocate the annual budget to the affected channel'],
 why:'<b>Competitive monitoring is a decision loop, not a reporting exercise:</b> <b>OBSERVE → COMPARE → INTERPRET → ACT</b>, then observe again. The interpret step asks explicitly: <b>“one-off spike or sustained shift? Reach, frequency or conversion play? Opportunity, threat — or simply difference?”</b><br><br>The warning is stated twice: <b>“Do not let one-off competitor activity become your strategy”</b> and <b>“strategic decisions require repeated evidence, context and a clear test.”</b> Before changing spend, <b>define the KPI</b>, then measure the response.<div class="work">DAILY     major launches, search bids,\n  live events → alert or investigate\nWEEKLY    creative changes, bursts, channel\n  shifts → tactical adjustment\nMONTHLY   SOV/SOS, mix, markets → optimise\nQUARTERLY structural patterns → reset\n  strategy or budget</div>And the five traps: <b>estimated spend treated as audited truth · different audiences or periods compared · SOV mistaken for effectiveness · creative presence mistaken for delivery · competitor action automatically copied.</b>'},

{t:'ai',tag:'apply',diff:'medium',
 q:'You need competitor creative across TV, print, radio and digital in one place, with estimated spend. Which tool?',
 opts:['TAM AdEx via MAP',
       'Google Trends',
       'The Meta Ad Library',
       'GA4'],
 why:'<b>TAM AdEx, tracked via the Media Analyser Package (MAP)</b>, monitors <b>650+ TV channels, 900+ publications, 100+ radio stations and 3,000+ digital publishers</b> — advertiser, brand, category, medium, vehicle, market, date, daypart, duration, creative, language and estimated expenditure.<br><br>Its limitations are the exam-worthy part: <b>estimated spend is not actual negotiated cost, monitoring coverage is not the whole market, and digital activity can be missing.</b><div class="work">Meta Ad Library  creative, copy, format,\n  active status — NOT spend, impressions,\n  reach or targeting for ordinary ads\nGoogle Ads Transparency  advertiser identity,\n  creative variants, region, run period\nSimilarweb / Semrush  estimated traffic;\n  Similarweb can miss by 40–70% on small sites\nComscore  panel-based cross-platform\n  audience measurement, an industry currency\nGoogle Trends  RELATIVE search interest —\n  not absolute volume, not causality\nSensor Tower / data.ai  app rankings and\n  modelled download and revenue estimates</div>Notice the pattern across all of them: <b>observed, estimated, or owned</b> — and a strong system <b>triangulates all three before forming a hypothesis and testing it</b>.'},

{t:'ai',tag:'concept',diff:'medium',trap:true,
 q:'“ChatGPT didn’t bring AI to media.” What are the four layers the deck describes?',
 opts:['Rules and automation, predictive ML, generative, agentic',
       'Generative, predictive ML, rules and automation, robotic',
       'Programmatic, generative, agentic, quantum',
       'Automation, dashboards, chatbots, personalisation'],
 why:'<div class="work">1 RULES & AUTOMATION  if–then trafficking,\n  scheduling, workflow. The oldest layer,\n  still everywhere.\n2 PREDICTIVE ML       bidding, propensity,\n  forecasting, fraud detection. Has run\n  activation for over a decade.\n3 GENERATIVE AI       copy, images,\n  summaries, synthesis. The layer that made\n  AI visible and conversational.\n4 AGENTIC             systems that coordinate\n  tasks and act within set permissions.\n  The newest, least settled layer.</div><b>These layers coexist — they don’t replace each other.</b> ChatGPT made AI conversational and made everyone finally notice it was already there.<br><br>Every AI application in media then falls into one of two buckets: <b>the Analytical Engine</b> (“where should the money go, and who should see it?” — audience intelligence, MMM, programmatic bidding, attribution, competitive monitoring) or <b>the Experience Engine</b> (“what does the brand actually feel like to interact with?” — generative creative, conversational assistants, personalisation, synthetic media).'},

{t:'ai',core:0,tag:'apply',diff:'medium',
 q:'HUL’s “Sangam” platform cut media planning turnaround from <b>25 days to 5</b>. What does the deck say this does <b>not</b> remove?',
 opts:['The planner’s judgement — AI output is a recommendation, not a decision',
       'The need for any competitive monitoring of rival brands',
       'The requirement to keep buying television in a market as diverse as India',
       'The cost of producing localised creative for each brand'],
 why:'The HUL numbers are real efficiency: <b>25 → 5 days</b> planning turnaround, TV share of premium-brand spend <b>60% → 39%</b>, digital video <b>20% → 29%</b>, and a <b>2.5× increase in digital media contribution via AI-led influencer selection</b> across 50+ brands.<br><br>But the deck separates that from the overhyped claims:<div class="work">REAL EFFICIENCY\n  ✓ turnaround speed · granular continuous\n    MMM · pattern detection across terabytes ·\n    algorithmic attribution for messy journeys\nOVERHYPED\n  ✗ treating AI output as a DECISION\n  ✗ optimising purely on short-term conversion\n    at the cost of brand-building\n  ✗ assuming no demographic/BARC anchor\n    is needed\n  ✗ believing it removes planner judgment</div>Top of the DO list: <b>treat AI output as a recommendation the planner signs off on.</b> Top of the DON’T list: <b>“the AI recommended it” is not a defensible answer in a client review.</b>'},

{t:'ai',tag:'concept',diff:'hard',trap:true,
 q:'AI-driven MMM retrains weekly instead of annually. What new failure mode does that introduce?',
 opts:['Overfitting to noise — random weekly swings mistaken for real effects',
       'It can no longer account for carryover effects or for diminishing returns',
       'It becomes unable to model channel-level contribution at all',
       'It removes the need for any incrementality testing'],
 why:'Speed and granularity bring their own failure modes:<div class="work">OVERFITS TO NOISE  weekly retraining on\n  volatile data mistakes random swings for\n  real effects, especially on low-spend channels\nATTRIBUTION ≠ CAUSATION  faster updates\n  deliver mis-attribution with more confidence\nREVERSE CAUSALITY  demand signals (search,\n  traffic) mistaken as CAUSED by spend\nSMALL-SAMPLE INSTABILITY  creative-level\n  cuts carry far less data than channel-level\nPLATFORM BLACK-BOX  a platform-run model\n  can over-credit its own inventory\nHARDER TO GOVERN  weekly-changing\n  recommendations are hard to audit</div>The verdict: <b>treat AI-driven MMM as a fast tactical layer on top of — not a replacement for — the rigorously validated strategic MMM.</b><br><br>The same caution applies to algorithmic attribution, which genuinely improves on last-click’s over-crediting of bottom-funnel search and retargeting, but is <b>black-box, data-hungry, blind to the dark funnel, and still only correlation</b>. <b>Validate its big shifts against an incrementality test or MMM.</b>'},

{t:'ai',core:0,tag:'apply',diff:'medium',
 q:'Cadbury’s “Shah Rukh Khan My Ad” generated thousands of ads naming individual local stores. What does the deck call this?',
 opts:['Generative creative and hyper-local media planning working as one system',
       'A standard dynamic creative optimisation test run on a single audience segment',
       'A conversational AI assistant acting as the brand experience',
       'An agentic system buying media without human involvement'],
 why:'The problem was specific: Diwali 2020, and <b>neighbourhood stores — Cadbury’s biggest offline channel — were hit hardest by the pandemic</b>, but a single celebrity ad cannot promote one kirana store. Machine learning recreated Shah Rukh Khan’s voice and face so retailers could <b>generate their own version naming their store</b>.<br><br>The deck’s point: this is <b>generative AI creative + hyper-local media planning working as one system — the two lenses of the session, combined.</b><div class="work">Zomato × Hrithik Roshan  AI adapted the\n  spoken city, restaurant and dish to the\n  viewer’s location — the CREATIVE changed\n  with context, not merely the targeting\nMirzapur  generative AI inserted fans into\n  the show’s world — the audience did not\n  just watch the promotion, they became\n  part of it\nTRESemmé “Talk to Ty”  a conversational AI\n  hair-styling assistant where the AI is not\n  promoting the product — it IS the product\n  experience</div>That last shift is the section’s big idea: <b>media moves from a delivery channel, where the consumer is a recipient, to an experience surface, where the consumer is a participant.</b>'},

{t:'ai',tag:'concept',diff:'hard',
 q:'As consumers delegate shopping research to AI agents, the deck argues planners will need which new KPI?',
 opts:['Share of recommendation — whether an agent chooses your brand',
       'Share of voice measured in impressions across the walled gardens',
       'Cost per thousand adjusted for attention seconds',
       'Effective reach at a 3+ frequency threshold'],
